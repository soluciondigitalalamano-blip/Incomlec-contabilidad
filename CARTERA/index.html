</script>
<style>
/* =========================================================
   TOKENS — para cambiar de marca basta con --accent-h/c (OKLCH)
   ========================================================= */
:root{
  --accent-h:152; --accent-c:.13;                       /* verde Incomelec #006F32 */
  --accent:       oklch(.47 var(--accent-c) var(--accent-h));
  --accent-strong:oklch(.38 calc(var(--accent-c)*.85) var(--accent-h));
  --accent-deep:  oklch(.27 calc(var(--accent-c)*.6) var(--accent-h));
  --accent-soft:  oklch(.95 .035 var(--accent-h));
  --accent-ink:   oklch(.40 var(--accent-c) var(--accent-h));
  --on-accent:#fff;

  --body:#E7E8E9; --shell:#F2F2F3; --card:#FFFFFF; --sub:#F6F6F7; --sub-2:#ECEDEE;
  --ink:#111312; --ink-2:#3E4541; --muted:#5A625D; --line:#E3E5E4;
  --danger:#B42318; --danger-soft:#FDECEA;
  --warn:#8F5200;  --warn-soft:#FFF3DC;
  --ok:var(--accent-ink); --ok-soft:var(--accent-soft);
  --t-pv:var(--accent); --t-d1:#E9B44C; --t-d2:#E28A3B; --t-d3:#C9572E; --t-d91:#B03A2E; --t-d181:#8E1F1F; --t-d361:#5E1212; --t-d4:#A3201C;

  --sh-1:0 1px 2px rgb(0 0 0 / .04), 0 8px 24px rgb(0 0 0 / .045);
  --sh-2:0 2px 6px rgb(0 0 0 / .06), 0 18px 40px rgb(0 0 0 / .09);
  --r-xl:30px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --accent:       oklch(.72 .15 var(--accent-h));
  --accent-strong:oklch(.62 .14 var(--accent-h));
  --accent-deep:  oklch(.30 .07 var(--accent-h));
  --accent-soft:  oklch(.30 .06 var(--accent-h));
  --accent-ink:   oklch(.80 .14 var(--accent-h));
  --on-accent:#06130B;
  --body:#090C0A; --shell:#101411; --card:#181D1A; --sub:#202622; --sub-2:#29302B;
  --ink:#EEF2EF; --ink-2:#CBD3CE; --muted:#A6B0AA; --line:#2C332E;
  --danger:#FF8C80; --danger-soft:#3A1916;
  --warn:#F2B95C;  --warn-soft:#33270F;
  --t-d4:#E0524A; --t-d91:#F07A6E; --t-d181:#E0524A; --t-d361:#B8322C;
  --sh-1:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  --sh-2:0 2px 6px rgb(0 0 0 / .35), 0 18px 40px rgb(0 0 0 / .4);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
.num,.tnum{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
main:focus,main:focus-visible{outline:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.lucide{width:18px;height:18px;stroke-width:1.75}

/* ---------- LAYOUT ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;gap:0}
.sidebar{position:sticky;top:var(--hdr-h,140px);height:calc(100vh - var(--hdr-h,140px));padding:20px 16px 16px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 10px}
.brand-logo{background:#fff;border-radius:12px;padding:8px 10px;box-shadow:var(--sh-1);display:flex}
.brand-logo img{height:22px;display:block}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.25}
.nav-group{position:relative}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:0 12px 8px}
.nav{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:2px}
.nav-ind{position:absolute;left:0;right:0;height:42px;border-radius:999px;background:var(--ink);transition:transform .35s var(--ease),opacity .2s;z-index:0;pointer-events:none}
:root[data-theme="dark"] .nav-ind{background:var(--accent)}
.nav button{position:relative;z-index:1;width:100%;display:flex;align-items:center;gap:11px;height:42px;padding:0 14px;border:0;background:none;border-radius:999px;font-weight:600;color:var(--ink-2);text-align:left;transition:color .25s}
.nav button:hover{background:var(--sub-2)}
.nav button[aria-current="page"]{color:#fff;background:none}
:root[data-theme="dark"] .nav button[aria-current="page"]{color:var(--on-accent)}
.nav .count{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sub-2);color:var(--ink-2)}
.nav button[aria-current="page"] .count{background:rgb(255 255 255 / .18);color:inherit}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;font-weight:600;color:var(--ink-2);font-size:13.5px}
.switch{position:relative;width:40px;height:24px;border-radius:999px;border:0;background:var(--sub-2);flex-shrink:0;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .25s var(--ease)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.side-card{margin-top:auto;border-radius:var(--r-lg);padding:18px;color:#fff;background:linear-gradient(120deg,#1E8A4C 0%,#187640 40%,#0F5A31 75%,#0B4426 100%);position:relative;overflow:hidden;box-shadow:0 14px 30px -16px rgb(6 40 22 / .6)}
.side-card::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 110% at 95% -10%,rgb(255 255 255 / .22),transparent 50%);pointer-events:none}
.side-card>*{position:relative}
.sc-top{display:flex;gap:10px;align-items:flex-start}
.sc-ic{width:36px;height:36px;border-radius:11px;background:rgb(255 255 255 / .16);display:grid;place-items:center;flex-shrink:0}
.sc-top b{display:block;font-size:14px;line-height:1.25}
.sc-top small{display:block;font-size:11.5px;opacity:.85;margin-top:2px}
.sc-box{margin-top:12px;border-radius:14px;background:rgb(255 255 255 / .14);padding:10px 12px}
.sc-box span{display:block;font-size:11px;font-weight:600;opacity:.88}
.sc-box b{display:block;font-size:24px;font-weight:750;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.sc-btn{margin-top:12px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;height:44px;padding:0 6px 0 16px;border:0;border-radius:999px;background:#fff;color:#111;font-weight:700;font-size:13px}
.sc-btn span.ar{width:32px;height:32px;border-radius:50%;background:#0F5A31;color:#fff;display:grid;place-items:center}
.sc-btn svg{width:16px;height:16px}

.shell{background:var(--shell);border-radius:var(--r-xl);margin:12px 12px 12px 0;padding:2px 0 40px;min-width:0;box-shadow:var(--sh-1)}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:16px 28px;background:color-mix(in oklab,var(--shell) 88%,transparent);backdrop-filter:blur(10px);border-radius:var(--r-xl) var(--r-xl) 0 0;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px;max-width:440px}
.search input{width:100%;height:42px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--sh-1);padding:0 44px 0 42px;font-size:14px}
.search>svg,.search>i{position:absolute;left:15px;top:12px;color:var(--muted)}
.search kbd{position:absolute;right:12px;top:10px;font:600 11px var(--font);padding:2px 7px;border-radius:6px;background:var(--sub-2);color:var(--ink-2)}
.results{position:absolute;top:48px;left:0;right:0;background:var(--card);border-radius:var(--r-md);box-shadow:var(--sh-2);padding:6px;display:none;max-height:420px;overflow:auto;z-index:60}
.results.open{display:block}
.results button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:10px;text-align:left}
.results button[aria-selected="true"],.results button:hover{background:var(--sub)}
.results .rt{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);padding:8px 10px 4px}
.results .rs{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.top-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.ctx{position:relative}
.ctx-btn{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px 0 6px;border:0;border-radius:999px;background:var(--card);box-shadow:var(--sh-1);font-weight:600;max-width:420px}
.ctx-btn .mono{width:30px;height:30px}
.ctx-btn .ctx-sum{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-menu{position:absolute;right:0;top:50px;width:340px;background:var(--card);border-radius:var(--r-md);box-shadow:var(--sh-2);padding:6px;display:none;z-index:60}
.ctx-menu.open{display:block}
.ctx-menu button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:12px}
.ctx-menu button:hover,.ctx-menu button[aria-checked="true"]{background:var(--sub)}
.ctx-menu b{display:block;font-size:13.5px}
.ctx-menu span{font-size:12px;color:var(--muted)}
.fresh{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:var(--sh-1);font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.fresh .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh-1);display:grid;place-items:center;color:var(--ink-2);position:relative}
.icon-btn .pip{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--card)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent-ink)}
.mono{border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0;width:36px;height:36px}

main{padding:18px 28px 0}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:10px 0 22px;flex-wrap:wrap}
.view-head h1{font-size:40px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.view-head p{color:var(--muted);margin-top:6px;font-size:15px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:0;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn-primary{background:var(--ink);color:var(--card)}
:root[data-theme="dark"] .btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ghost{background:var(--card);box-shadow:var(--sh-1);color:var(--ink)}
.btn-sm{height:32px;padding:0 13px;font-size:12.5px}
.btn:hover{filter:brightness(1.06)}

/* ---------- HEADER (banda verde) ---------- */
.side-head{padding:8px 12px 4px;line-height:1.25}
.side-head b{display:block;font-size:22px;font-weight:700;letter-spacing:-.015em}
.side-head span{font-size:12px;color:var(--muted);font-weight:600}
.hdr{position:sticky;top:0;z-index:50;margin:0 12px;border-top:12px solid var(--body);box-sizing:content-box;transition:padding .25s var(--ease),min-height .25s var(--ease);padding:22px 30px;min-height:116px;color:#fff;isolation:isolate;display:flex;align-items:center;justify-content:space-between;gap:24px}
.hdr::before{content:'';position:absolute;inset:0;z-index:-1;border-radius:24px;
  background:radial-gradient(120% 160% at 92% -20%,rgb(255 255 255 / .24),transparent 45%),linear-gradient(115deg,#1E8A4C 0%,#187640 40%,#0F5A31 72%,#0B4426 100%);
  clip-path:polygon(0 0,calc(100% - 54px) 0,100% 54px,100% 100%,0 100%);box-shadow:0 14px 34px -18px rgb(6 40 22 / .6)}
:root[data-theme="dark"] .hdr::before{background:radial-gradient(120% 160% at 92% -20%,rgb(255 255 255 / .14),transparent 45%),linear-gradient(115deg,#166B3B 0%,#11552F 45%,#0B3F23 75%,#082E1A 100%)}
.logo-frame{background:#fff;border-radius:14px;padding:10px 28px 11px;outline:2.5px solid #fff;outline-offset:3px;margin:6px;display:flex;align-items:center;flex-shrink:0;box-shadow:0 10px 22px -10px rgb(0 0 0 / .35)}
.wordmark{font-family:'Poppins','Inter',system-ui,sans-serif;font-style:italic;font-weight:800;font-size:clamp(28px,2.4vw,36px);line-height:1;letter-spacing:.01em;color:#0E6B37;white-space:nowrap;padding-right:.08em}
.hdr-right{display:flex;align-items:center;gap:14px;padding-right:38px;flex:0 1 720px;min-width:0;justify-content:flex-end}
.hdr .search{flex:1;max-width:540px;min-width:0}
.hdr .search input{height:56px;background:#fff;color:#111;box-shadow:0 4px 12px rgb(0 0 0 / .12);font-size:15px;padding-left:48px}
.hdr .search>svg,.hdr .search>i{top:19px;left:18px;color:#5A625D}
.hdr .search kbd{top:15px;right:14px;padding:4px 10px;background:#ECEDEE;color:#3E4541}
.hdr .results{color:var(--ink);top:62px}
.theme-seg{display:flex;align-items:center;gap:6px;height:56px;padding:5px;border-radius:999px;background:#fff;box-shadow:0 4px 12px rgb(0 0 0 / .12);flex-shrink:0}
.theme-seg button{width:46px;height:46px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:#2A302C}
.theme-seg button[aria-checked="true"]{background:#111;color:#fff}
.page-head{position:sticky;top:var(--hdr-h,140px);z-index:35;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:nowrap;padding:18px 28px 14px;background:var(--shell);border-radius:var(--r-xl) var(--r-xl) 0 0}
.ph-title h1{font-size:40px;font-weight:650;letter-spacing:-.025em;line-height:1.1}
.ph-corte{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:15px;font-weight:600;color:var(--ink-2)}
.ph-corte .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ph-title{flex-shrink:0}
.ph-tools{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;min-width:0}
.ph-tools .ctx{min-width:0}
.ph-tools .ctx-btn{max-width:360px;min-width:0}
.ph-tools .ctx-btn>span:nth-child(2){min-width:0;overflow:hidden}
.ph-crit{height:46px}
@media (max-width:1380px){.ph-tools .ctx-btn .ctx-sum{display:none}}
@media (max-width:980px){.page-head{flex-wrap:wrap}.ph-tools{flex-wrap:wrap}}
.hb{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);color:var(--ink-2);display:grid;place-items:center;position:relative;box-shadow:var(--sh-1);flex-shrink:0}
.hb:hover,.theme-seg button:hover{filter:brightness(.95)}
.hb .pip{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:#D92D20;border:2px solid var(--card)}
.ph-tools .ctx-btn{height:46px}
@media (max-width:1100px){.hdr .search{max-width:none}}
@media (max-width:720px){
  .hdr{margin:10px 10px 0;padding:16px;flex-direction:column;align-items:stretch;gap:14px}
  .logo-frame{align-self:flex-start;padding:8px 20px}.wordmark{font-size:26px}
  .hdr-right{padding-right:0;flex:1 1 auto}
  .hdr .search input,.theme-seg{height:48px}.theme-seg button{width:38px;height:38px}
  .hdr .search>svg,.hdr .search>i{top:15px}.hdr .search kbd{top:11px}
  .page-head{padding:16px 16px 10px;border-radius:0}.ph-title h1{font-size:30px}.ph-crit{flex:1 1 100%;justify-content:center}.ph-tools .ctx{flex:1 1 auto}.ph-tools .ctx-btn>span:nth-child(2){overflow:visible}
  .ph-tools{width:100%}.ph-tools .ctx{flex:1}.ph-tools .ctx-btn{width:100%;max-width:none;justify-content:space-between}
}
/* banda compacta al bajar */
body.compact .hdr{padding-top:10px;padding-bottom:10px;min-height:0}
body.compact .wordmark{font-size:24px}
body.compact .logo-frame{padding:6px 18px}
body.compact .hdr .search input,body.compact .theme-seg{height:44px}
body.compact .theme-seg button{width:36px;height:36px}
body.compact .hdr .search>svg,body.compact .hdr .search>i{top:13px}
body.compact .hdr .search kbd{top:10px}
body.compact .hdr::before{clip-path:polygon(0 0,calc(100% - 36px) 0,100% 36px,100% 100%,0 100%)}
.ph-week{color:var(--muted);font-weight:500}
@media (max-width:720px){.hdr{position:relative;border-top:0;margin-top:10px}.page-head{position:relative;top:0}.ph-week{display:block;width:100%}.ph-sep{display:none}}
/* ---------- BENTO ---------- */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.c-12{grid-column:span 12}.c-8{grid-column:span 8}.c-7{grid-column:span 7}.c-6{grid-column:span 6}.c-5{grid-column:span 5}.c-4{grid-column:span 4}.c-3{grid-column:span 3}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:24px;position:relative;min-width:0;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.card.hov:hover{box-shadow:var(--sh-2)}
.enter{opacity:0;transform:translateY(10px);animation:enter .38s var(--ease) forwards}
@keyframes enter{to{opacity:1;transform:none}}
.static .enter{animation:none;opacity:1;transform:none}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-h h3{font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.35}
.card-h .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.card-h p{font-size:12.5px;color:var(--muted);margin-top:4px}
.go{width:34px;height:34px;border-radius:50%;border:0;background:var(--sub);display:grid;place-items:center;color:var(--ink);flex-shrink:0;transition:background .2s,transform .2s}
.go:hover{background:var(--ink);color:var(--card)}
.go svg{width:16px;height:16px}
.sub-card{background:var(--sub);border-radius:var(--r-md);padding:14px 16px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:1.35fr repeat(4,1fr);gap:18px}
.kpi{cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px;container-type:inline-size}
.kpi .k-l{font-size:clamp(12.5px,5.2cqi,15px);font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.kpi .k-l .ic{width:clamp(30px,11cqi,38px);height:clamp(30px,11cqi,38px);border-radius:10px;background:var(--sub);display:grid;place-items:center;color:var(--ink-2)}
.kpi .k-v{font-size:clamp(24px,15cqi,46px);white-space:nowrap;font-weight:750;letter-spacing:-.02em;margin-top:auto;line-height:1.1}
.kpi .k-s{font-size:clamp(12px,4.6cqi,14px);color:var(--muted)}
.kpi.hero{background:linear-gradient(120deg,#1E8A4C 0%,#187640 40%,#0F5A31 75%,#0B4426 100%);color:#fff;overflow:hidden}
:root[data-theme="dark"] .kpi.hero{background:linear-gradient(120deg,#166B3B 0%,#11552F 45%,#0B3F23 100%)}
.kpi.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(110% 120% at 90% -15%,rgb(255 255 255 / .22),transparent 50%);pointer-events:none}
.kpi.hero .k-l,.kpi.hero .k-s{color:rgb(255 255 255 / .9)}
.kpi.hero .k-l{padding-right:44px}
.kpi.hero .k-l .ic{background:rgb(255 255 255 / .16);color:#fff}
.kpi.hero .k-v{font-size:clamp(30px,17cqi,60px)}
.kpi .k-x{font-size:clamp(11.5px,4.3cqi,13.5px);color:var(--muted);font-variant-numeric:tabular-nums}
.kpi.hero .k-x{color:rgb(255 255 255 / .85)}
.kpi.hero .corner{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;background:rgb(255 255 255 / .18);display:grid;place-items:center}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:clamp(11.5px,4.2cqi,13px);font-weight:700;padding:3px 9px;border-radius:999px;width:max-content}
.delta.good{background:var(--ok-soft);color:var(--ok)}
.delta.bad{background:var(--danger-soft);color:var(--danger)}
.delta.flat{background:var(--sub-2);color:var(--ink-2)}
.kpi.hero .delta{background:rgb(255 255 255 / .18);color:#fff}

/* ---------- PILLS / CHIPS ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.neu{background:var(--sub-2);color:var(--ink-2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--sh-1);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;color:var(--ink-2)}
.chip .n{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--sub-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] .n{background:rgb(255 255 255 / .2);color:inherit}
.sel{height:36px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--sh-1);padding:0 14px;font-weight:600;font-size:13px;max-width:240px}
.seg{display:inline-flex;background:var(--sub-2);padding:3px;border-radius:999px}
.seg button{border:0;background:none;height:32px;padding:0 14px;border-radius:999px;font-weight:600;font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh-1)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--sub-2);color:var(--ink-2);margin:1px 4px 1px 0;white-space:nowrap}
.tag.bad{background:var(--danger-soft);color:var(--danger)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

/* ---------- COMPOSITION BAR ---------- */
.stack{display:flex;height:46px;border-radius:14px;overflow:hidden;gap:3px}
.stack button{border:0;padding:0;height:100%;min-width:4px;transition:filter .2s,transform .2s;position:relative}
.stack button:hover{filter:brightness(1.1)}
.stack-leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.stack-leg button{border:0;background:var(--sub);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.stack-leg button:hover{background:var(--sub-2)}
.stack-leg .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stack-leg b{font-size:15px}
.stack-leg span{font-size:12px;color:var(--muted)}
.striped{background-image:repeating-linear-gradient(45deg,rgb(255 255 255 / .28) 0 4px,transparent 4px 9px)}

/* ---------- WALLET 3D (nivel 1) ---------- */
.wallet{display:grid;grid-template-columns:1fr 1fr;gap:18px;perspective:1200px}
.ecard{container-type:inline-size;position:relative;height:clamp(214px,40cqi,250px);border:0;padding:0;background:none;text-align:left;transform-style:preserve-3d;transition:transform .45s var(--ease)}
.ecard:hover .face.front{box-shadow:0 22px 40px -14px rgb(0 0 0 / .42)}
.ecard-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s var(--ease);transform:rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--flip,0deg)))}
.ecard.flipped .ecard-in{--flip:180deg}
.face{position:absolute;inset:0;border-radius:22px;padding:20px 22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;color:#fff;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 36px -12px rgb(0 0 0 / .35)}
.face::before{content:'';position:absolute;inset:0;background:radial-gradient(110% 120% at 92% -20%,rgb(255 255 255 / .2),transparent 50%);pointer-events:none}
.face::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgb(255 255 255 / .28),transparent 45%);opacity:var(--glare,0);transition:opacity .3s;pointer-events:none}
.face.back{transform:rotateY(180deg)}
.ecard.is-ctx .face.front{outline:3px solid var(--accent);outline-offset:3px}
.e-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1}
.e-logo{background:#fff;border-radius:10px;padding:6px 9px;display:flex}
.e-logo img{height:18px;display:block}
.e-name{font-size:15px;font-weight:700;margin-top:14px;position:relative;z-index:1}
.e-sub{font-size:12px;opacity:.85;position:relative;z-index:1}
.e-val{font-size:clamp(24px,10cqi,36px);font-weight:750;letter-spacing:-.02em;margin-top:auto;position:relative;z-index:1}
.e-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgb(255 255 255 / .18);margin-top:8px;position:relative;z-index:1}
.e-bar i{display:block;height:100%}
.e-leg{display:flex;justify-content:space-between;font-size:11.5px;margin-top:6px;opacity:.95;position:relative;z-index:1}
.e-back-row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid rgb(255 255 255 / .14);position:relative;z-index:1}
.e-back-row:last-of-type{border-bottom:0}
.sel-frame{position:absolute;inset:-9px;pointer-events:none;opacity:0;transition:opacity .2s}
.sel-frame::before,.sel-frame::after,.sel-frame i::before,.sel-frame i::after{content:'';position:absolute;width:18px;height:18px;border:3px solid var(--accent)}
.sel-frame::before{top:0;left:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.sel-frame::after{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.sel-frame i::before{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.sel-frame i::after{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
.sel-frame b{position:absolute;top:-14px;left:22px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.03em}
.ecard.is-sel .sel-frame{opacity:1}

/* ---------- BRIDGE ---------- */
.bridge{display:flex;flex-direction:column;gap:4px}
.br-row{display:grid;grid-template-columns:minmax(150px,220px) 1fr minmax(120px,auto);gap:16px;align-items:center;border:0;background:none;padding:10px;border-radius:12px;text-align:left;width:100%}
.br-row:hover{background:var(--sub)}
.br-l b{display:block;font-size:13px}.br-l small{color:var(--muted);font-size:11.5px}
.br-track{position:relative;height:22px;border-radius:8px;background:var(--sub)}
.br-track i{position:absolute;top:0;bottom:0;border-radius:7px;min-width:3px}
.br-stripe{background-image:repeating-linear-gradient(45deg,rgb(255 255 255 / .45) 0 4px,transparent 4px 9px)}
.br-v{font-weight:750;font-size:14px;text-align:right}
@media (max-width:640px){.br-row{grid-template-columns:1fr auto}.br-track{grid-column:1/3;grid-row:2}}
/* ---------- PRIORIDAD / COMPARATIVOS ---------- */
.prio{display:flex;flex-direction:column;gap:2px}
.prio-row{display:grid;grid-template-columns:22px minmax(150px,240px) minmax(0,1fr) 84px 58px;gap:12px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:12px;text-align:left;width:100%}
.prio-row:hover,.prio-row.is-sel{background:var(--sub)}
.prio-row .rn{font-size:11px;font-weight:700;color:var(--muted)}
.prio-row .pn b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prio-row .pn small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prio-row .pb{display:block;height:14px;border-radius:99px;background:var(--sub-2);overflow:hidden}
.prio-row .pbar{display:flex;height:100%;border-radius:99px;overflow:hidden}
.prio-row .pbar i{display:block;height:100%}
.prio-row .pv{font-weight:750;font-size:13.5px;text-align:right}
.prio-row .pd{text-align:right}
@media (max-width:640px){.prio-row{grid-template-columns:18px minmax(0,1fr) auto;}.prio-row .pb{grid-column:2/4;grid-row:2}.prio-row .pd{display:none}}
.emp-cmp{display:flex;flex-direction:column;gap:10px}
.ec-l{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.ec-bar{display:grid;grid-template-columns:1fr 72px;gap:8px;align-items:center;width:100%;border:0;background:none;padding:2px 0;text-align:left;border-radius:6px}
.ec-bar:hover .ecb{filter:brightness(.95)}
.ecb{display:block;height:10px;border-radius:99px;background:var(--sub);overflow:hidden}
.ecb i{display:block;height:100%;border-radius:99px}
.ecv{font-size:12px;font-weight:700;text-align:right}
.ecmp{width:100%;border-collapse:separate;border-spacing:0;margin-top:18px;font-size:13px;table-layout:fixed}
.ecmp th:first-child,.ecmp td:first-child{width:36%}
.kpis.k4{grid-template-columns:1.35fr repeat(3,1fr)}
@media (max-width:1280px){.kpis.k4{grid-template-columns:repeat(3,1fr)}}
@media (max-width:768px){.kpis.k4{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.kpis.k4{grid-template-columns:1fr}.ecmp{font-size:12px}.ecmp th,.ecmp td{padding:8px 5px;white-space:normal;word-break:break-word}}
.ecmp th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);text-align:right;padding:8px 10px;background:var(--sub)}
.ecmp th:first-child{text-align:left;border-radius:10px 0 0 10px}.ecmp th:last-child{border-radius:0 10px 10px 0}
.ecmp td{padding:10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.ecmp td:first-child{text-align:left;font-weight:600;color:var(--ink-2)}
.ecmp tr:last-child td{border-bottom:0}
/* ---------- LISTS / ROWS ---------- */
.rank{display:flex;flex-direction:column;gap:6px}
.rank-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 10px;border-radius:12px;border:0;background:none;text-align:left;width:100%}
.rank-row:hover,.rank-row.is-sel{background:var(--sub)}
.rank-row .rn{font-size:11px;font-weight:700;color:var(--muted)}
.rank-row .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .vl{font-weight:700;font-size:13px}
.rank-row .track{grid-column:2/4;display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--sub-2)}
.rank-row .track i{display:block;height:100%}
.ref-line{position:relative}
.op-row{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr) auto auto 18px;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;border:0;background:none;text-align:left;width:100%}
.op-row:hover,.op-row.is-sel{background:var(--sub)}
.op-row b{display:block;font-size:13.5px}
.op-row small{display:block;color:var(--muted);font-size:12px}

/* ---------- INSIGHTS / ALERTS ---------- */
.insight{display:flex;gap:12px;padding:12px 12px;border-radius:14px;border:0;background:none;text-align:left;width:100%;align-items:flex-start}
.insight:hover{background:var(--sub)}
.insight .ii{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:var(--accent-soft);color:var(--accent-ink)}
.insight .ii.bad{background:var(--danger-soft);color:var(--danger)}
.insight .ii.warn{background:var(--warn-soft);color:var(--warn)}
.insight p{font-size:13.5px;font-weight:550;line-height:1.45}
.insight small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.alert-hero{border-radius:var(--r-md);padding:18px;background:var(--danger-soft);color:var(--danger);border:0;text-align:left;width:100%;display:block}
.alert-hero .ah-l{font-size:11px;font-weight:800;letter-spacing:.08em}
.alert-hero .ah-v{font-size:24px;font-weight:750;margin:6px 0 2px;color:var(--ink)}
.alert-hero p{font-size:13px;color:var(--ink-2)}

/* ---------- BULLETS (metas) ---------- */
.bullet{padding:14px 0;border-bottom:1px solid var(--line)}
.bullet:last-child{border-bottom:0}
.bullet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.bullet-h b{font-size:13.5px}
.bullet-h label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.bullet-h input{width:92px;height:30px;border-radius:999px;border:0;background:var(--sub);padding:0 12px;font-weight:700;text-align:right}
.b-track{position:relative;height:18px;border-radius:99px;background:var(--sub-2);overflow:hidden}
.b-zone{position:absolute;top:0;bottom:0}
.b-zone.in{left:0;background:var(--ok-soft);box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--accent) 35%,transparent);border-radius:99px 0 0 99px}
.b-zone.out{right:0;background:var(--danger-soft);border-radius:0 99px 99px 0}
.b-leg{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-top:8px}
.b-leg span{display:inline-flex;align-items:center;gap:6px}
.b-leg i{display:inline-block;width:10px;height:10px;border-radius:3px}
.b-fill{position:absolute;left:3px;top:5px;bottom:5px;border-radius:99px;transition:width .6s var(--ease)}
.b-foot{font-size:12.5px;margin-top:6px;font-weight:700}

/* ---------- TABLES ---------- */
.tbl-wrap{overflow:auto;border-radius:var(--r-md);background:var(--card)}
.tbl-wrap.tall{max-height:560px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:var(--sub);text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);padding:0;white-space:nowrap}
thead th button,thead th span.th{display:flex;align-items:center;gap:4px;width:100%;border:0;background:none;padding:11px 12px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
thead th.r button,thead th.r span.th{justify-content:flex-end}
thead th:first-child{border-radius:12px 0 0 12px}thead th:last-child{border-radius:0 12px 12px 0}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--sub)}
tbody tr.is-sel{background:var(--accent-soft)}
tbody tr.is-sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
td.r,th.r{text-align:right}
td.r{font-variant-numeric:tabular-nums;font-weight:600}
td.wrap{white-space:normal;min-width:220px}
td .s{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
tfoot td{padding:12px;font-weight:750;border-top:2px solid var(--ink);background:var(--card);position:sticky;bottom:0}
.none{color:var(--muted);font-style:italic;font-weight:500}

/* ---------- CALENDAR ---------- */
.cal-h{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.cal-h h3{font-size:20px;font-weight:650;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cal-day{min-height:104px;border-radius:14px;background:var(--sub);padding:8px;border:0;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative}
.cal-day.empty{background:transparent}
.cal-day.has{cursor:pointer}
.cal-day.has:hover{background:var(--sub-2)}
.cal-day .d{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.cal-day.is-corte{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-day.is-today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day .mk{position:absolute;top:7px;right:7px;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:99px;background:var(--ink);color:var(--card);letter-spacing:.03em}
.cal-day.is-today .mk{background:var(--accent);color:var(--on-accent)}
.ev{font-size:10.5px;font-weight:700;border-radius:8px;padding:3px 6px;display:flex;gap:3px;align-items:center;line-height:1.25;white-space:nowrap;overflow:hidden}
.ev svg{width:12px;height:12px;flex-shrink:0}
.ev.venc{background:var(--danger-soft);color:var(--danger)}
.ev.porv{background:var(--accent-soft);color:var(--accent-ink);background-image:repeating-linear-gradient(45deg,color-mix(in oklab,var(--accent) 14%,transparent) 0 3px,transparent 3px 7px)}
.cal-day.is-sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--card)}
.agenda-item{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:12px}
.agenda-item:hover{background:var(--sub)}
.date-box{width:46px;flex-shrink:0;border-radius:12px;background:var(--sub);text-align:center;padding:6px 0}
.date-box b{display:block;font-size:17px;line-height:1.1}
.date-box span{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px}

/* ---------- PEOPLE ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.person .p-top{display:flex;gap:12px;align-items:center}
.person .p-av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:750;font-size:15px;color:#1b1b1b}
.person h3{font-size:15px;font-weight:650}
.person small{color:var(--muted);font-size:12px}
.p-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 12px}
.p-metrics .sub-card b{display:block;font-size:16px;margin-top:2px}
.p-metrics .sub-card span{font-size:11.5px;color:var(--muted);font-weight:600}
.meter{height:10px;border-radius:99px;background:var(--sub-2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.p-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* ---------- CLIENT CARDS ---------- */
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ccard{cursor:pointer;padding:18px}
.ccard.is-sel{box-shadow:0 0 0 2.5px var(--accent),var(--sh-2)}
.ccard .c-top{display:flex;gap:10px;align-items:center}
.ccard h4{font-size:13.5px;font-weight:650;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .c-val{font-size:20px;font-weight:750;margin-top:14px}
.ccard .c-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;gap:8px}

/* ---------- QUALITY ---------- */
.q-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto 18px;gap:14px;align-items:center;padding:14px;border-radius:14px;border:0;background:none;width:100%;text-align:left}
.q-row:hover{background:var(--sub)}
.q-row .ii{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.q-row b{font-size:14px;display:block}
.q-row small{color:var(--muted);font-size:12.5px;display:block;margin-top:2px;line-height:1.45}

/* ---------- INSPECTOR ---------- */
.insp{position:fixed;top:12px;right:12px;bottom:12px;width:min(560px,calc(100vw - 24px));background:var(--card);border-radius:var(--r-xl);box-shadow:0 30px 80px rgb(0 0 0 / .25);z-index:80;transform:translateX(calc(100% + 30px));transition:transform .4s var(--ease),width .35s var(--ease);display:flex;flex-direction:column;overflow:hidden}
.insp.open{transform:none}
.insp.wide{width:min(1100px,calc(100vw - 24px))}
.insp-bar{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.insp-bar .sp{flex:1}
.insp-bar .icon-btn{width:36px;height:36px;box-shadow:none;background:var(--sub)}
.insp-bar .icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.insp-body{overflow:auto;padding:22px 24px 30px;flex:1}
.insp-type{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
.insp-body h2{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:6px 0 4px;line-height:1.2}
.insp-sub{color:var(--muted);font-size:13px}
.insp-state{display:flex;gap:10px;align-items:center;margin:14px 0 18px;flex-wrap:wrap}
.insp-state small{color:var(--ink-2);font-size:12.5px}
.mini-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.mini-kpis .sub-card span{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.mini-kpis .sub-card b{display:block;font-size:18px;margin:3px 0 8px}
.insp h4{font-size:13px;font-weight:750;margin:20px 0 10px}
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .18);z-index:70;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:600}

/* ---------- TOAST ---------- */
.toasts{position:fixed;left:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;background:#141614;color:#fff;padding:11px 16px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--sh-2);animation:tIn .3s var(--ease)}
.toast .td{width:8px;height:8px;border-radius:50%;background:#5BD38C}
.toast .td.bad{background:#FF7B6E}
.toast button{border:0;background:rgb(255 255 255 / .14);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
@keyframes tIn{from{opacity:0;transform:translateY(10px)}}

/* ---------- SKELETON ---------- */
.sk{background:linear-gradient(90deg,var(--sub) 0%,var(--sub-2) 50%,var(--sub) 100%);background-size:200% 100%;animation:sk 1s linear infinite;border-radius:var(--r-lg)}
@keyframes sk{to{background-position:-200% 0}}

.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.chart-box{position:relative;height:280px}
.chart-box.tall{height:380px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.empty{padding:36px 10px;text-align:center;color:var(--muted)}
.footer{padding:28px 28px 0;font-size:12px;color:var(--muted);line-height:1.6}

::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}

/* ---------- RESPONSIVE ---------- */
@media (max-width:1280px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi.hero{grid-column:span 3}
  .c-8,.c-7,.c-6,.c-5,.c-4{grid-column:span 12}
  .c-3{grid-column:span 6}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:12px;gap:12px}
  .side-head,.nav-label,.side-card,.sidebar .gen{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap}
  .nav-ind{display:none}
  .nav button[aria-current="page"]{background:var(--ink);color:var(--card)}
  .shell{margin:0;border-radius:0}
  main{padding:4px 16px 0}
  .view-head h1{font-size:30px}
}
@media (max-width:768px){
  .wallet{grid-template-columns:1fr;perspective:none}
  .ecard-in{transform:none !important}
  .ecard.flipped .face.back{display:none}
  .face.back{display:none}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi.hero{grid-column:span 2}
  .c-3{grid-column:span 12}
  .op-row{grid-template-columns:minmax(0,1fr) auto 18px}
  .op-row .hide-m{display:none}
  .ctx-btn .ctx-sum{display:none}
  .cal-day{min-height:70px;padding:5px}
  .ev .evt{display:none}
  .fresh .ft{display:none}
}
@media (max-width:480px){
  .kpis{grid-template-columns:1fr}
  .kpi.hero{grid-column:span 1}
  .card{padding:18px}
  .search{min-width:100%}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .enter{opacity:1;transform:none}
}
@media print{
.hdr-right,.ph-tools,
  .sidebar,.topbar,.insp,.scrim,.toasts,.btn,.go{display:none !important}
  .app{display:block}.shell{margin:0;box-shadow:none}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .tbl-wrap{max-height:none !important;overflow:visible}
}
</style>
</head>
<body>
<a href="#view" class="sr-only">Saltar al contenido</a>
<header class="hdr">
      <div class="logo-frame" role="img" aria-label="Incomelec"><span class="wordmark" aria-hidden="true">INCOMELEC</span></div>
      <div class="hdr-right">
        <div class="search" role="search">
          <i data-lucide="search"></i>
          <label for="q" class="sr-only">Buscar cliente, NIT, comercial o documento</label>
          <input id="q" type="text" autocomplete="off" placeholder="Buscar cliente, NIT o documento..." role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
          <kbd>/</kbd>
          <div class="results" id="results" role="listbox" aria-label="Resultados"></div>
        </div>
        <div class="theme-seg" role="radiogroup" aria-label="Tema de color">
          <button role="radio" data-theme-set="system" aria-label="Tema del sistema" title="Sistema"><i data-lucide="monitor"></i></button>
          <button role="radio" data-theme-set="light" aria-label="Tema claro" title="Claro"><i data-lucide="sun"></i></button>
          <button role="radio" data-theme-set="dark" aria-label="Tema oscuro" title="Oscuro"><i data-lucide="moon"></i></button>
        </div>
      </div>
    </header>
<div class="app">
  <aside class="sidebar" aria-label="Navegación principal">
    <div class="nav-group">
      <div class="nav-label">MENÚ</div>
      <ul class="nav" id="navMain" role="list">
        <span class="nav-ind" id="navInd" aria-hidden="true"></span>
      </ul>
    </div>
    <div class="nav-group gen">
      <div class="nav-label">GENERAL</div>
      <ul class="nav" id="navGen" role="list"></ul>
      <div class="switch-row"><span id="lblWeek">Semana inicia lunes</span><button class="switch" role="switch" id="swWeek" aria-labelledby="lblWeek" aria-checked="true"></button></div>
    </div>

  </aside>

  <div class="shell">
    <div class="page-head">
      <div class="ph-title"><h1 id="vTitle">Cartera</h1><p class="ph-corte"><span class="dot" aria-hidden="true"></span><span id="vCorte"></span></p></div>
      <div class="ph-tools">
        <div class="ctx">
          <button class="ctx-btn" id="ctxBtn" aria-haspopup="menu" aria-expanded="false"></button>
          <div class="ctx-menu" id="ctxMenu" role="menu" aria-label="Elegir empresa"></div>
        </div>
        <button class="hb" id="btnAlerts" aria-label="Ver alertas"><i data-lucide="bell"></i><span class="pip" id="alertPip"></span></button>
        <button class="btn btn-primary ph-crit" data-act="view" data-id="riesgo"><i data-lucide="shield-alert"></i>Ver clientes críticos</button>
      </div>
    </div>
    <main id="view" tabindex="-1"></main>
    <div class="footer" id="footer"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="insp" id="insp" role="dialog" aria-modal="false" aria-labelledby="inspTitle" aria-hidden="true">
  <div class="insp-bar">
    <button class="icon-btn" id="inspBack" aria-label="Volver al detalle anterior"><i data-lucide="arrow-left"></i></button>
    <span class="sp"></span>
    <button class="icon-btn" id="inspPin" aria-pressed="false" aria-label="Fijar panel"><i data-lucide="pin"></i></button>
    <button class="icon-btn" id="inspWide" aria-pressed="false" aria-label="Ampliar panel"><i data-lucide="maximize-2"></i></button>
    <button class="icon-btn" id="inspClose" aria-label="Cerrar panel (Esc)"><i data-lucide="x"></i></button>
  </div>
  <div class="insp-body" id="inspBody"></div>
</aside>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
/* =========================================================

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const COPF=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const NUMF=new Intl.NumberFormat('es-CO');
const fmt=n=>COPF.format(Math.round(n||0));
const fmtN=n=>NUMF.format(Math.round(n||0));
const fmtP=(n,d=1)=>(n||0).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
function fmtC(n){n=n||0;const a=Math.abs(n),s=n<0?'−':'';
  if(a>=1e9) return s+'$'+(a/1e9).toLocaleString('es-CO',{maximumFractionDigits:2})+' MM';
  if(a>=1e6) return s+'$'+(a/1e6).toLocaleString('es-CO',{maximumFractionDigits:1})+' M';
  if(a>=1e3) return s+'$'+Math.round(a/1e3)+' mil';
  return s+'$'+Math.round(a);}
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ymd=iso=>{const p=iso.split('-');return [+p[0],+p[1]-1,+p[2]];};
const fDate=iso=>{const [y,m,d]=ymd(iso);return d+' '+MES[m]+' '+y;};
const fDateS=iso=>{const [y,m,d]=ymd(iso);return d+' '+MES[m];};
const dayDiff=(a,b)=>Math.round((Date.UTC(...ymd(b))-Date.UTC(...ymd(a)))/864e5);
const addDays=(iso,n)=>{const t=new Date(Date.UTC(...ymd(iso))+n*864e5);return t.toISOString().slice(0,10);};
const todayISO=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
const titleCase=s=>s.toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase());
const initials=s=>s.replace(/\b(DE|LA|DEL|Y|S\.?A\.?S?\.?|SAS|LTDA|PH|S|A)\b/gi,' ').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const reduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isNC=d=>d==='NC'||d==='NCNC';
const DOCN={IS:'Factura (tipo IS)',FV:'Factura de venta',NC:'Nota crédito',NCNC:'Nota crédito (NCNC)',SI:'Saldo inicial migrado'};
const TRAMOS=[{k:'pv',l:'Corriente',v:'--t-pv'},{k:'d1',l:'1–30 días',v:'--t-d1'},{k:'d2',l:'31–60 días',v:'--t-d2'},{k:'d3',l:'61–90 días',v:'--t-d3'},{k:'d91',l:'91–180 días',v:'--t-d91'},{k:'d181',l:'181–360 días',v:'--t-d181'},{k:'d361',l:'Más de 360 días',v:'--t-d361'},{k:'uc',l:'Sin clasificar',v:'--muted'}];
const BK=['pv','d1','d2','d3','d91','d181','d361','uc'];
const SK=BK.concat('d4');
const zero=()=>Object.fromEntries(SK.map(k=>[k,0]));
const expTramo=d=>d<=0?'pv':d<=30?'d1':d<=60?'d2':d<=90?'d3':d<=180?'d91':d<=360?'d181':'d361';
const tramoLabel=k=>(TRAMOS.find(t=>t.k===k)||{}).l||'—';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const PASTEL=['#CFE8D9','#F6DDB8','#D9E2F5','#F3D3D3','#E3D9F2','#D6EEF0','#EFE7C8'];
const pastel=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return PASTEL[h%PASTEL.length];};
const empShort=e=>(DATA.empresas[e]||{}).corto||e;

/* =========================================================
   ESTADO GLOBAL — única fuente de verdad
   ========================================================= */
const state={
  view:'resumen', empresa:'all', ncModo:'fuente',
  metas:Object.assign({},DATA.metas),
  cli:{estado:'all',comercial:'all',ciudad:'all',q:'',modo:'tabla'},
  sort:{col:'val',dir:'desc'}, sortCom:'val',
  cal:null, weekStart:'lun', theme:'system',
  sel:null, inspHist:[], pinned:false, wide:false
};
(function loadPrefs(){try{const p=JSON.parse(localStorage.getItem('incomelec_cartera_prefs')||'{}');
  if(p.metas) Object.assign(state.metas,p.metas); if(p.theme) state.theme=p.theme; if(p.weekStart) state.weekStart=p.weekStart;}catch(e){}})();
function savePrefs(){try{localStorage.setItem('incomelec_cartera_prefs',JSON.stringify({metas:state.metas,theme:state.theme,weekStart:state.weekStart}));}catch(e){}}
{const [y,m]=ymd(DATA.corte);state.cal=[y,m];}

/* =========================================================
   DERIVACIÓN
   ========================================================= */
function buildRows(){
  return DATA.facturas.map((r,i)=>{
    const sg=(state.ncModo==='credito'&&isNC(r.doc))?-1:1;
    const o={...r,id:i,nc:isNC(r.doc),key:r.emp+'|'+r.cli};
    for(const k of BK) o[k]=(r[k]||0)*sg; o.val=r.val*sg;
    o.d4=o.d91+o.d181+o.d361;
    o.venc=o.d1+o.d2+o.d3+o.d4;
    o.tramo=BK.find(k=>r[k])||'pv';
    o.n=r.num||('#'+String(i+1).padStart(3,'0'));
    o.dias=dayDiff(r.fven,DATA.corte);
    return o;});
}
function agg(rows){
  const T={val:0,...zero()};
  const cm=new Map(),pm=new Map(),ym=new Map();
  let rw=0,rv=0,nVenc=0;
  for(const r of rows){
    for(const k in T) T[k]+=r[k];
    if(r.venc>0){nVenc++;rw+=r.venc*Math.max(r.dias,0);rv+=r.venc;}
    let c=cm.get(r.key);
    if(!c){c={key:r.key,emp:r.emp,cli:r.cli,nit:r.nit,ciu:r.ciu,rows:[],coms:new Map(),val:0,...zero(),nVenc:0,rw:0,rv:0};cm.set(r.key,c);}
    c.rows.push(r);for(const k of SK)c[k]+=r[k];c.val+=r.val;c.coms.set(r.com,(c.coms.get(r.com)||0)+r.val);
    if(r.venc>0){c.nVenc++;c.rw+=r.venc*Math.max(r.dias,0);c.rv+=r.venc;}
    let p=pm.get(r.com);
    if(!p){p={com:r.com,rows:[],cl:new Set(),val:0,...zero()};pm.set(r.com,p);}
    p.rows.push(r);p.cl.add(r.key);for(const k of SK)p[k]+=r[k];p.val+=r.val;
    let y=ym.get(r.ciu);
    if(!y){y={ciu:r.ciu,rows:[],cl:new Set(),val:0,venc:0};ym.set(r.ciu,y);}
    y.rows.push(r);y.cl.add(r.key);y.val+=r.val;y.venc+=r.venc;
  }
  T.d4=T.d91+T.d181+T.d361;T.venc=T.d1+T.d2+T.d3+T.d4;
  const clients=[...cm.values()];
  for(const c of clients){
    c.venc=c.d1+c.d2+c.d3+c.d4;
    c.estado=(c.d3+c.d4>0)?'Crítico':(c.venc>0?'Vencido':'Al día');
    c.dias=c.rv?c.rw/c.rv:0;
    c.comPrincipal=[...c.coms.entries()].sort((a,b)=>b[1]-a[1])[0][0];
    c.pct=T.val?c.val/T.val*100:0;
    c.nfact=c.rows.length;
  }
  clients.sort((a,b)=>b.val-a.val);
  const coms=[...pm.values()].map(p=>({...p,venc:p.d1+p.d2+p.d3+p.d4,nCli:p.cl.size})).sort((a,b)=>b.val-a.val);
  const ciudades=[...ym.values()].map(y=>({...y,nCli:y.cl.size})).sort((a,b)=>b.val-a.val);
  const antMid=T.venc?(T.d1*15+T.d2*45+T.d3*75+T.d4*120)/T.venc:0;
  const kpi={tot:T.val,corr:T.pv,venc:T.venc,pctV:T.val?T.venc/T.val*100:0,mas90:T.d4,pct90:T.val?T.d4/T.val*100:0,
    nCli:clients.length,nVenc,antMid,antReal:rv?rw/rv:0,nDocs:rows.length};
  return {T,kpi,clients,coms,ciudades,cmap:cm};
}
let D=null;
function recaudoDe(e){const rows=DATA.recibos.filter(r=>e==='all'||r.emp===e);const f=rows.map(r=>r.fecha).sort();
  return {valor:rows.reduce((s,r)=>s+r.valor,0),recibos:new Set(rows.map(r=>r.emp+'|'+r.recibo)).size,lineas:rows.length,rows,desde:f[0],hasta:f[f.length-1]};}
function prevKpi(e){const rs=DATA.anterior.facturas.filter(r=>e==='all'||r.emp===e);const s=k=>rs.reduce((a,r)=>a+r[k],0);
  return {fecha:DATA.anterior.corte,total:s('val'),corriente:s('pv'),vencida:s('d1')+s('d2')+s('d3')+s('d4'),mas90:s('d4'),nClientes:new Set(rs.map(r=>r.emp+'|'+r.cli)).size,nFactVenc:rs.filter(r=>r.d1+r.d2+r.d3+r.d4>0).length};}
/* Empareja cada documento del corte anterior con el actual: sigue igual, abonado o ya no aparece */
const OLD=DATA.anterior.facturas.map((r,i)=>({...r,oid:i,key:r.emp+'|'+r.cli}));
(function matchOld(){const pool=new Map();DATA.facturas.forEach((r,i)=>{const k=r.emp+'|'+r.cli;if(!pool.has(k))pool.set(k,[]);pool.get(k).push({r,i,used:false});});
  for(const o of OLD){const p=pool.get(o.key)||[];let m=p.find(x=>!x.used&&x.r.fecha===o.fecha&&Math.abs(x.r.val-o.val)<1);
    if(m){m.used=true;o.sem='Sigue';o.nid=m.i;continue;}
    m=p.find(x=>!x.used&&x.r.fecha===o.fecha&&x.r.fven===o.fven&&x.r.val<o.val);
    if(m){m.used=true;o.sem='Abonado';o.nid=m.i;o.abono=o.val-m.r.val;continue;}
    o.sem='Ya no aparece';}})();
/* Cruza cada recibo con el documento del corte anterior que pagó: tramo de mora al corte anterior y días de mora al pagar */
const RECM=DATA.recibos.map((r,i)=>({...r,rid:i,key:r.emp+'|'+r.cli}));
(function matchRec(){const used=new Set();const amt=o=>o.abono!=null?o.abono:o.val;
  for(const r of RECM.slice().sort((a,b)=>b.valor-a.valor)){
    const c=OLD.filter(o=>o.key===r.key&&o.sem!=='Sigue'&&!used.has(o.oid));let best=null;
    for(const tol of [.02,.08]){for(const o of c){const d=Math.abs(amt(o)-r.valor)/Math.max(amt(o),1);if(d<=tol&&(!best||d<best.d))best={d,o};}if(best)break;}
    if(best){const o=best.o;used.add(o.oid);r.oid=o.oid;r.fven=o.fven;r.tramo=o.pv?'pv':o.d1?'d1':o.d2?'d2':o.d3?'d3':'d4';r.diasPago=dayDiff(o.fven,r.fecha);r.com=o.com;}
    else{r.tramo='nd';r.diasPago=null;}}})();
const TR_REC=[{k:'pv',l:'Aún no vencía al '+fDateS(DATA.anterior.corte),v:'--t-pv'},{k:'d1',l:'1–30 días de mora',v:'--t-d1'},{k:'d2',l:'31–60 días de mora',v:'--t-d2'},{k:'d3',l:'61–90 días de mora',v:'--t-d3'},{k:'d4',l:'Más de 90 días de mora',v:'--t-d4'},{k:'nd',l:'Sin identificar',v:'--muted'}];
function recCtx(){return RECM.filter(r=>state.empresa==='all'||r.emp===state.empresa);}
function bridgeData(){
  const e=state.empresa;const old=OLD.filter(r=>e==='all'||r.emp===e);const rec=recaudoDe(e).rows;
  const cur=D.ctx;const nue=cur.filter(r=>r.fecha>DATA.anterior.corte);
  const cm=new Map();const g=(em,c)=>{const k=em+'|'+c;if(!cm.has(k))cm.set(k,{key:k,emp:em,cli:c,old:0,rec:0,nue:0,cur:0,recRows:[],oldRows:[],nueRows:[]});return cm.get(k);};
  old.forEach(r=>{const x=g(r.emp,r.cli);x.old+=r.val;x.oldRows.push(r);});
  rec.forEach(r=>{const x=g(r.emp,r.cli);x.rec+=r.valor;x.recRows.push(r);});
  nue.forEach(r=>{const x=g(r.emp,r.cli);x.nue+=r.val;x.nueRows.push(r);});
  cur.forEach(r=>{g(r.emp,r.cli).cur+=r.val;});
  const cl=[...cm.values()];cl.forEach(x=>x.otras=x.old-x.rec+x.nue-x.cur);
  const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
  return {cl,old,rec,nue,oldT:sum(cl,'old'),recT:sum(cl,'rec'),nueT:sum(cl,'nue'),curT:sum(cl,'cur'),otrasT:sum(cl,'otras')};
}
function derive(){
  const rows=buildRows();
  const ctx=state.empresa==='all'?rows:rows.filter(r=>r.emp===state.empresa);
  const A=agg(ctx);
  A.recaudo=recaudoDe(state.empresa);
  D={rows,ctx,A,all:agg(rows),comparable:state.ncModo==='fuente',prev:prevKpi(state.empresa)};
  D.bridge=bridgeData();
  return D;
}

/* =========================================================
   REGISTRO DE DETALLES (cada elemento clicable abre una lista)

let LISTS={},lid=0;
function regList(title,sub,rows,extra){const id='L'+(++lid);LISTS[id]={title,sub,rows,extra};return id;}

/* =========================================================
   ANÁLISIS: alertas, insights y calidad
   ========================================================= */
function computeAlerts(){
  const A=D.A,k=A.kpi,m=state.metas,out=[];
  const rolling=D.ctx.filter(r=>r.d3>0).map(r=>({r,fecha:addDays(r.fven,91)})).sort((a,b)=>b.r.d3-a.r.d3);
  if(rolling.length){
    const tot=rolling.reduce((s,x)=>s+x.r.d3,0); const first=rolling.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha))[0];
    out.push({tone:'bad',hero:true,t:`${fmtC(tot)} en 61–90 días pasarán a +90 días`,d:`${rolling.length} documento(s). El primero cruza el ${fDate(first.fecha)}; el mayor es ${titleCase(rolling[0].r.cli)} (${fmtC(rolling[0].r.d3)}, cruza el ${fDate(rolling[0].fecha)}).`,list:regList('Documentos a punto de superar 90 días','Tramo 61–90 días al corte; fecha estimada = vencimiento + 91 días',rolling.map(x=>x.r))});
  }
  if(k.pctV>m.maxVencida) out.push({tone:'bad',t:`Cartera vencida en ${fmtP(k.pctV)} (meta ≤ ${fmtP(m.maxVencida,0)})`,d:`Supera la meta por ${fmtP(k.pctV-m.maxVencida)} puntos: ${fmtC(k.venc)} vencidos de ${fmtC(k.tot)}.`,list:regList('Cartera vencida','Documentos con saldo en mora al corte',D.ctx.filter(r=>r.venc>0))});
  if(k.pct90>m.max90) out.push({tone:'bad',t:`Cartera a +90 días en ${fmtP(k.pct90)} (meta ≤ ${fmtP(m.max90,0)})`,d:`${fmtC(k.mas90)} con más de 90 días; ${fmtP(k.pct90/m.max90*100,0)} del máximo permitido.`,list:regList('Cartera a más de 90 días','Tramo +90 días',D.ctx.filter(r=>r.d4!==0))});
  if(D.comparable&&D.bridge.otrasT>1e6) out.push({tone:'bad',t:`${fmtC(D.bridge.otrasT)} bajaron sin recibo en el archivo`,d:'La cartera bajó más de lo que explican los recibos de la semana. Confirmar con contabilidad si son anulaciones, notas crédito o pagos sin registrar.',act:['otras','x']});
  const top=A.clients[0];
  if(top&&top.pct>=m.concentracion) out.push({tone:'warn',t:`${titleCase(top.cli)} concentra ${fmtP(top.pct)} de la cartera`,d:`Por encima del ${m.concentracion}% recomendado como límite por cliente.`,sel:['cliente',top.key]});
  if(k.antMid>m.antObj) out.push({tone:'warn',t:`Antigüedad promedio de ${Math.round(k.antMid)} días (meta ${m.antObj})`,d:`Ponderada por tramos; la mora real por fecha de vencimiento es ${Math.round(k.antReal)} días.`,list:regList('Cartera vencida','Base del cálculo de antigüedad',D.ctx.filter(r=>r.venc>0))});
  return out;
}
function computeInsights(){
  const A=D.A,k=A.kpi,out=[];const cl=A.clients;
  if(cl[0]){const c=cl[0];const all90=c.val>0&&c.d4/c.val>.95;
    out.push({ic:'target',tone:all90?'bad':'warn',t:`${titleCase(c.cli)} es el ${fmtP(c.pct)} de toda la cartera${all90?' y todo su saldo supera 90 días':''}.`,
      s:`Dato: ${fmt(c.val)} · ${c.nfact} documento(s) · corte ${fDate(DATA.corte)} · confianza alta (cálculo directo)`,sel:['cliente',c.key]});}
  const c90=cl.filter(c=>c.d4>0).sort((a,b)=>b.d4-a.d4);
  if(c90.length>=3&&k.mas90>0){const s=c90.slice(0,3).reduce((a,c)=>a+c.d4,0);
    out.push({ic:'hourglass',tone:'bad',t:`Tres clientes explican el ${fmtP(s/k.mas90*100,0)} de la cartera a +90 días: ${c90.slice(0,3).map(c=>titleCase(c.cli).split(' ').slice(0,3).join(' ')).join(', ')}.`,
      s:`Dato: ${fmt(s)} de ${fmt(k.mas90)} · confianza alta`,list:regList('Cartera a más de 90 días','Tramo +90 días, todos los clientes',D.ctx.filter(r=>r.d4!==0))});}
  const c1=cl.filter(c=>c.d1>0).sort((a,b)=>b.d1-a.d1)[0];
  if(c1&&k.tot){const after=(k.venc-c1.d1)/k.tot*100;
    out.push({ic:'trending-down',tone:'ok',t:`Recuperar los ${fmtC(c1.d1)} de ${titleCase(c1.cli)} (1–30 días) bajaría la vencida de ${fmtP(k.pctV)} a ${fmtP(after)}.`,
      s:`Dato: mora real de ${Math.round(c1.dias)} días · confianza alta (supone total no vencido sin cambios)`,sel:['cliente',c1.key]});}
  const lim=addDays(DATA.corte,14);const nx=D.ctx.filter(r=>r.fven>DATA.corte&&r.fven<=lim&&r.val>0);
  if(nx.length){const s=nx.reduce((a,r)=>a+r.val,0);
    out.push({ic:'calendar-clock',tone:'ok',t:`Entre el ${fDateS(addDays(DATA.corte,1))} y el ${fDate(lim)} vencen ${fmtC(s)} en ${nx.length} documentos.`,
      s:`Es la caja esperada de las dos semanas siguientes al corte · confianza media (el corte no muestra pagos posteriores)`,list:regList('Vencimientos de las 2 semanas siguientes al corte',`${fDate(addDays(DATA.corte,1))} a ${fDate(lim)}`,nx)});}
  if(D.comparable){const B=D.bridge;const top=B.cl.filter(x=>x.otras>1).sort((a,b)=>b.otras-a.otras)[0];
    if(B.otrasT>1&&top) out.unshift({ic:'search-x',tone:'bad',t:`${fmtC(B.otrasT)} salieron de la cartera sin recibo en el archivo; ${fmtC(top.otras)} son de ${titleCase(top.cli)}.`,
      s:`Puede ser anulación, nota crédito o pago fuera de la semana: confirmar con contabilidad · ${fDateS(DATA.anterior.corte)} a ${fDateS(DATA.corte)} · confianza alta en el monto, causa desconocida`,act:['otras','x']});
    const P=D.prev;const dv=k.venc-P.vencida,dc=k.corr-P.corriente;
    out.push({ic:'git-compare',tone:dv<0?'ok':'bad',t:`Frente al ${fDateS(P.fecha)}, la vencida ${dv<0?'bajó':'subió'} ${fmtC(Math.abs(dv))} (${fmtP(Math.abs(dv)/P.vencida*100)}) y la corriente ${dc>=0?'subió':'bajó'} ${fmtC(Math.abs(dc))}.`,
      s:`Dato: corte anterior ${fDate(P.fecha)} vs ${fDate(DATA.corte)} · confianza alta`,view:'resumen',list:regList('Cartera vencida al corte actual','Para comparar con el corte del '+fDateS(P.fecha),D.ctx.filter(r=>r.venc>0))});}
  return out.slice(0,5);
}
function computeQuality(){
  const R=D.rows,out=[];
  const nc=R.filter(r=>r.nc);
  out.push({ic:'file-minus',tone:'bad',t:`${nc.length} notas crédito con valor positivo`,d:`Suman ${fmt(nc.reduce((s,r)=>s+Math.abs(r.val),0))} y hoy se cuentan como deuda a +90 días. Si son saldo a favor del cliente, la cartera real es menor en el doble de ese valor. Puedes verlas restando con el interruptor de abajo.`,rows:nc});
  const si=R.filter(r=>r.doc==='SI'),siBad=si.filter(r=>r.fven<r.fecha);
  out.push({ic:'archive',tone:'warn',t:`${si.length} saldos iniciales migrados (SI)`,d:`${fmt(si.reduce((s,r)=>s+r.val,0))}. ${siBad.length} tienen fecha de vencimiento anterior a su fecha de registro (31 oct 2025): se conservan como vienen; su antigüedad real es la del vencimiento original.`,rows:si});
  const multi=D.all.clients.filter(c=>c.coms.size>1);
  out.push({ic:'users',tone:'warn',t:`${multi.length} clientes con documentos de varios comerciales`,d:`El tablero atribuye cada documento a su comercial (no al cliente completo) para no inflar a nadie. En las listas de clientes se muestra el comercial con mayor saldo.`,rows:multi.flatMap(c=>c.rows)});
  const byNit=new Map();for(const c of D.all.clients){if(!c.nit)continue;if(!byNit.has(c.nit))byNit.set(c.nit,[]);byNit.get(c.nit).push(c);}
  const dupN=[...byNit.values()].filter(a=>a.length>1);
  out.push({ic:'copy',tone:'neu',t:`${dupN.length} NIT con nombre o ciudad distinta entre empresas`,d:dupN.map(a=>a.map(c=>`${titleCase(c.cli)} (${empShort(c.emp)}, ${c.ciu})`).join(' / ')).join(' · ')+'. Se muestran por separado como en la fuente.',rows:dupN.flat().flatMap(c=>c.rows)});
  if(D.comparable&&Math.abs(D.bridge.otrasT)>=1){const B=D.bridge;out.unshift({ic:'search-x',tone:'bad',t:`${fmt(B.otrasT)} bajaron sin recibo en el archivo`,d:`Entre el ${fDate(DATA.anterior.corte)} y el ${fDate(DATA.corte)}, ${B.cl.filter(x=>Math.abs(x.otras)>=1).length} clientes bajaron más de lo que explican los recibos. El mayor caso: ${titleCase(B.cl.slice().sort((a,b)=>b.otras-a.otras)[0].cli)}. Confirmar si son anulaciones, notas crédito o pagos sin registrar.`,rows:[],act:['otras','x'],n:B.cl.filter(x=>Math.abs(x.otras)>=1).length});}
  const resid=OLD.filter(o=>o.sem==='Abonado'&&o.nid!=null&&DATA.facturas[o.nid].val<o.val*.02).map(o=>R[o.nid]).filter(Boolean);
  if(resid.length) out.push({ic:'coins',tone:'warn',t:`${resid.length} saldos residuales después de un pago`,d:`Suman ${fmt(resid.reduce((s,r)=>s+r.val,0))}. Son facturas pagadas casi completas (quedó menos del 2%); suele ser una retención no aplicada. Conviene cerrarlas para que no envejezcan.`,rows:resid});
  const over=D.bridge.cl.filter(x=>x.rec>x.old+x.nue+1);
  if(over.length) out.push({ic:'circle-plus',tone:'warn',t:`${over.length} cliente(s) con recibos mayores a su saldo`,d:over.map(x=>`${titleCase(x.cli)}: recibos ${fmt(x.rec)} frente a saldo de ${fmt(x.old+x.nue)}`).join(' · ')+'. Puede haber un saldo a favor o un recargo cobrado aparte.',rows:[],act:['otras','x'],n:over.length});
  const g=new Map();for(const r of R){const kk=r.key+'|'+r.fecha+'|'+r.val;if(!g.has(kk))g.set(kk,[]);g.get(kk).push(r);}
  const dup=[...g.values()].filter(a=>a.length>1);
  if(dup.length){const real=dup.filter(a=>new Set(a.map(r=>r.num)).size<a.length);
    out.push({ic:'layers',tone:real.length?'warn':'ok',t:real.length?`${real.length} grupos de documentos idénticos con el mismo número`:`${dup.length} grupos de documentos idénticos: no son duplicados`,d:real.length?'Mismo cliente, fecha, valor y número de documento. Revisar en el ERP.':`Mismo cliente, fecha y valor, pero con números de documento distintos (${dup.map(a=>a.map(r=>r.num).join(', ')).join(' · ')}). Son facturas diferentes.`,rows:dup.flat()});}
  const byNum=new Map();for(const r of R){if(!r.num)continue;const kk=r.emp+'|'+r.num;if(!byNum.has(kk))byNum.set(kk,[]);byNum.get(kk).push(r);}
  const rep=[...byNum.values()].filter(a=>a.length>1);
  if(rep.length) out.push({ic:'hash',tone:'warn',t:`${rep.length} número(s) de documento repetido(s)`,d:rep.map(a=>`"${a[0].num}" aparece ${a.length} veces en ${titleCase(a[0].cli)} con valores distintos`).join(' · ')+'. La referencia del ERP no es única para estas líneas.',rows:rep.flat()});
  const odd=R.filter(r=>!['FV','SI','NC','NCNC'].includes(r.doc));
  if(odd.length) out.push({ic:'file-question',tone:'neu',t:`${odd.length} documento(s) con tipo poco común (${[...new Set(odd.map(r=>r.doc))].join(', ')})`,d:odd.map(r=>`${r.num} de ${titleCase(r.cli)}`).join(' · ')+'. Se trata como factura.',rows:odd});
  const sinNit=R.filter(r=>!r.nit||r.ciu==='Sin dato'),cc=R.filter(r=>/^CC/.test(r.nit)||/-\s*$/.test(r.nit));
  if(sinNit.length||cc.length) out.push({ic:'id-card',tone:'neu',t:`${new Set(sinNit.concat(cc).map(r=>r.key)).size} cliente(s) con identificación incompleta`,d:`${[...new Set(cc.map(r=>titleCase(r.cli)))].join(', ')} aparece con tipo CC y sin dígito de verificación.${sinNit.length?' '+new Set(sinNit.map(r=>r.key)).size+' sin NIT o ciudad.':''}`,rows:sinNit.concat(cc)});
  const okB=R.filter(r=>expTramo(r.dias)===r.tramo).length;
  out.push({ic:'badge-check',tone:okB===R.length?'ok':'warn',t:`Tramos de mora verificados: ${okB} de ${R.length}`,d:`Cada documento cae en el tramo que corresponde a su fecha de vencimiento frente al corte del ${fDate(DATA.corte)}. El archivo ahora separa la mora de más de 90 días en 91–180, 181–360 y más de 360 días.`,rows:R});
  out.push({ic:'message-square-off',tone:'neu',t:`Gestión de cobro y compromisos de pago: sin dato`,d:`Este archivo no trae bitácora de cobranza. Al integrarla desde el CRM se activan "última gestión", "compromiso de pago" y un tablero de seguimiento.`,rows:[]});
  return out;
}

function deltaHtml(cur,prev,goodDown,kind){
  if(!D.comparable) return '';
  const diff=cur-prev;
  const vs='vs '+fDateS(D.prev.fecha);
  if(Math.abs(diff)<.05) return `<span class="delta flat">= sin cambio ${vs}</span>`;
  const down=diff<0,good=goodDown?down:!down;
  let t=kind==='money'?fmtC(Math.abs(diff)):kind==='pp'?fmtP(Math.abs(diff))+' pts':kind==='days'?Math.round(Math.abs(diff))+' días':fmtN(Math.abs(diff));
  return `<span class="delta ${good?'good':'bad'}">${down?'↓':'↑'} ${t} ${vs}</span>`;
}
const cnt=(id,v,f)=>`<span class="cnt tnum" data-cid="${id}" data-v="${v}" data-f="${f}">${f==='cop'?fmtC(v):f==='pct'?fmtP(v):f==='d'?Math.round(v)+' días':fmtN(v)}</span>`+(f==='cop'?`<div class="k-x">${fmt(v)}</div>`:'');
function estadoPill(e){
  if(e==='Crítico') return `<span class="pill bad"><i data-lucide="alert-octagon"></i>Crítico</span>`;
  if(e==='Vencido') return `<span class="pill warn"><i data-lucide="clock-alert"></i>Vencido</span>`;
  return `<span class="pill ok"><i data-lucide="check-circle-2"></i>Al día</span>`;
}
function mono(name,emp,size=36){const e=DATA.empresas[emp];const bg=e?e.color:'#0E6B37';
  return `<span class="mono" style="width:${size}px;height:${size}px;background:${pastel(name)};color:#1b1b1b" aria-hidden="true">${esc(initials(name))}</span>`;}
function stackBar(o,h=8){const tot=BK.reduce((s,k)=>s+Math.max(o[k],0),0)||1;
  return BK.filter(k=>o[k]>0).map(k=>`<i style="width:${(o[k]/tot*100).toFixed(2)}%;background:var(${TRAMOS.find(t=>t.k===k).v})" title="${tramoLabel(k)}: ${fmt(o[k])}"></i>`).join('');}
function invTable(rows,opts={}){
  if(!rows.length) return `<div class="empty">No hay documentos para mostrar.</div>`;
  const tot=rows.reduce((s,r)=>s+r.val,0);
  const showCli=opts.cli!==false;
  const sorted=rows.slice().sort((a,b)=>opts.byDate?a.fven.localeCompare(b.fven):(b.val-a.val));
  return `<div class="tbl-wrap${opts.tall?' tall':''}"><table><thead><tr>
   <th><span class="th">Documento</span></th><th><span class="th">Tipo</span></th>${showCli?'<th><span class="th">Cliente</span></th>':''}
   <th><span class="th">Emisión</span></th><th><span class="th">Vence</span></th><th class="r"><span class="th">Días mora</span></th><th><span class="th">Tramo</span></th><th><span class="th">Comercial</span></th><th class="r"><span class="th">Valor</span></th></tr></thead><tbody>
   ${sorted.map(r=>`<tr ${act('factura',r.id,'Ver documento '+r.n)} tabindex="0" data-sel="factura:${r.id}">
     <td><b>${r.n}</b></td><td>${esc(r.doc)}${r.nc?' <span class="tag warn">signo</span>':''}</td>
     ${showCli?`<td class="wrap">${esc(titleCase(r.cli))}<span class="s">${esc(empShort(r.emp))}</span></td>`:''}
     <td>${fDate(r.fecha)}</td><td>${fDate(r.fven)}</td><td class="r">${r.dias>0?r.dias:'—'}</td><td>${tramoLabel(r.tramo)}</td><td>${esc(titleCase(r.com))}</td><td class="r">${fmt(r.val)}</td></tr>`).join('')}
   </tbody><tfoot><tr><td colspan="${showCli?8:7}">Total · ${rows.length} documento(s)</td><td class="r">${fmt(tot)}</td></tr></tfoot></table></div>`;
}

  // insights

  // metas

function bridgeCard(){
  if(!D.comparable) return '';
  const B=D.bridge;const mx=Math.max(B.oldT,B.curT,B.oldT-B.recT+B.nueT)||1;
  const P=v=>(v/mx*100).toFixed(2)+'%';
  const a0=B.oldT,a1=a0-B.recT,a2=a1+B.nueT,a3=a2-B.otrasT;
  const steps=[
    {l:'Saldo al '+fDateS(DATA.anterior.corte),s:'',v:B.oldT,x0:0,x1:a0,c:'var(--sub-2)',bd:'var(--muted)',act:['prevdocs','x']},
    {l:'Recaudo con recibo',s:'−',v:B.recT,x0:a1,x1:a0,c:'var(--accent)',act:['recaudo','x'],n:`${D.A.recaudo.recibos} recibos · ${D.A.recaudo.lineas} aplicaciones`},
    {l:'Facturación nueva',s:'+',v:B.nueT,x0:Math.min(a1,a2),x1:Math.max(a1,a2),c:'var(--t-d1)',act:['list',regList('Facturación nueva de la semana','Documentos emitidos después del '+fDate(DATA.anterior.corte),B.nue)],n:`${B.nue.length} documento(s)`},
    {l:'Bajas sin recibo en el archivo',s:B.otrasT>=0?'−':'+',v:Math.abs(B.otrasT),x0:Math.min(a2,a3),x1:Math.max(a2,a3),c:'var(--danger)',striped:true,act:['otras','x'],n:`${B.cl.filter(x=>Math.abs(x.otras)>=1).length} cliente(s) · revisar`},
    {l:'Saldo al '+fDateS(DATA.corte),s:'',v:B.curT,x0:0,x1:B.curT,c:'var(--accent-deep)',act:['list',regList('Cartera al corte actual','Todos los documentos',D.ctx)]}];
  return `<div class="card c-12 enter" style="animation-delay:.08s">
   <div class="card-h"><div><div class="eyebrow">Movimiento de la semana · ${fDateS(DATA.anterior.corte)} → ${fDateS(DATA.corte)}</div>
   <h3>La cartera ${B.curT<B.oldT?'bajó':'subió'} ${fmtC(Math.abs(B.oldT-B.curT))}: ${fmtC(B.recT)} con recibo y ${fmtC(B.otrasT)} sin recibo en el archivo</h3>
   <p>Puente del saldo anterior al actual. Lo rayado en rojo es la diferencia que los recibos de la semana no explican. Haz clic en cada paso.</p></div></div>
   <div class="bridge" role="list">${steps.map(t=>`<button class="br-row" role="listitem" ${act(t.act[0],t.act[1],t.l+': '+t.s+fmt(t.v))}>
     <span class="br-l"><b>${t.l}</b>${t.n?`<small>${t.n}</small>`:''}</span>
     <span class="br-track"><i class="${t.striped?'br-stripe':''}" style="left:${P(t.x0)};width:${P(Math.max(t.x1-t.x0,0))};background-color:${t.c}${t.bd?';box-shadow:inset 0 0 0 1.5px '+t.bd:''}"></i></span>
     <span class="br-v tnum">${t.s?t.s+' ':''}${fmt(t.v)}</span></button>`).join('')}</div></div>`;
}
function empCompare(emps){

   ${D.comparable?row('Vencida vs '+fDateS(DATA.anterior.corte),x=>dlt(x.k.venc,x.pr.vencida)):''}

  const cal=`<div class="card c-8 enter">
   <div class="cal-h"><div><div class="eyebrow" style="font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)">CALENDARIO DE VENCIMIENTOS</div><h3>${MESL[m]} ${y}</h3><p class="note" style="margin-top:2px">${monthN?`${monthN} documentos vencen este mes · ${fmt(monthTot)}`:'Sin vencimientos este mes'}</p></div>
    <div class="chips"><button class="chip" data-act="cal" data-id="-1" aria-label="Mes anterior"><i data-lucide="chevron-left"></i></button><button class="chip" data-act="cal" data-id="corte">Corte</button><button class="chip" data-act="cal" data-id="hoy">Hoy</button><button class="chip" data-act="cal" data-id="1" aria-label="Mes siguiente"><i data-lucide="chevron-right"></i></button></div></div>
   <div class="cal-grid" role="grid" aria-label="Calendario ${MESL[m]} ${y}">${dows.map(d=>`<div class="cal-dow" role="columnheader">${d}</div>`).join('')}${cells}</div>
   <div class="legend" style="margin-top:14px"><span><i style="background:var(--danger-soft);box-shadow:inset 0 0 0 1.5px var(--danger)"></i>! Vencido al corte</span><span><i class="striped" style="background-color:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)"></i>◷ Por vencer al corte</span><span>Las flechas del teclado mueven el foco entre días.</span></div>
   <p class="note">Hoy es ${fDate(hoy)}. Los documentos que vencían después del ${fDateS(DATA.corte)} pueden haberse pagado ya: este corte no lo refleja.</p></div>`;

let CH={};
const isDark=()=>document.documentElement.dataset.theme==='dark';
function pal(){const dk=isDark();return {ink:cssv('--ink'),muted:cssv('--muted'),line:cssv('--line'),dark:dk,
  accent:dk?'#4FCB82':'#0E7A3D',prev:dk?'#59615C':'#C5CAC7',danger:dk?'#FF7B6E':'#B42318',
  d1:'#E9B44C',d4:dk?'#E0524A':'#A3201C'};}
function stripe(fg,bg){const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,8,8);x.strokeStyle=fg;x.lineWidth=2;x.beginPath();x.moveTo(-2,10);x.lineTo(10,-2);x.moveTo(-2,2);x.lineTo(2,-2);x.moveTo(6,10);x.lineTo(10,6);x.stroke();return x.createPattern(c,'repeat');}
const lblPlugin={id:'lbl',afterDatasetsDraw(ch,a,o){if(!o||!o.on)return;const c=ch.ctx;c.save();c.font='600 11px Inter, sans-serif';c.fillStyle=o.color;
  ch.data.datasets.forEach((ds,di)=>{const meta=ch.getDatasetMeta(di);if(meta.hidden)return;meta.data.forEach((el,i)=>{const p=ds.data[i];
    if(o.mode==='bubble'){if(!p.lbl)return;c.textAlign='left';c.fillText(p.lbl,el.x+(el.options.radius||6)+5,el.y+4);}
    else if(o.mode==='bar'){if(!p)return;c.textAlign='center';c.fillText(fmtC(p),el.x,el.y-7);}});});c.restore();}};
function chartBase(p){return {responsive:true,maintainAspectRatio:false,animation:reduced()?false:{duration:550,easing:'easeOutCubic'},
  plugins:{legend:{display:false},tooltip:{backgroundColor:'#141614',padding:10,cornerRadius:10,titleFont:{family:'Inter',weight:'700'},bodyFont:{family:'Inter'}}},
  scales:{x:{grid:{display:false},border:{display:false},ticks:{color:p.muted,font:{family:'Inter',size:11}}},y:{beginAtZero:true,grid:{color:p.line},border:{display:false},ticks:{color:p.muted,font:{family:'Inter',size:11},callback:v=>fmtC(v)}}}};}
function drawCharts(){
  Object.values(CH).forEach(c=>c.destroy());CH={};

    const o=chartBase(p);o.plugins.lbl={on:true,mode:'bar',color:p.ink};o.layout={padding:{top:18}};

    o.onClick=(e,els)=>{if(!els.length)return;const i=els[0].index;if(els[0].datasetIndex===ds.length-1)openList(regList(labels[i]+' al corte actual','Documentos que forman la cifra',lists[keys[i]]));else if(hist[els[0].datasetIndex].fecha===DATA.anterior.corte)selectObj('prevdocs','x');else toast('Ese corte solo trae totales, no documentos','bad');};

    o.plugins.tooltip.callbacks={label:c=>fmt(c.parsed.y)};

    o.onHover=(e,els)=>{e.native.target.style.cursor=els.length?'pointer':'default';};

  const el2=$('#chRisk');

    o.scales.y.title={display:true,text:'Valor vencido',color:p.muted,font:{family:'Inter',size:11,weight:'600'}};

    CH.risk=new Chart(el2,{type:'bubble',data:{datasets:[{data:pts,backgroundColor:pts.map(x=>col(x)+'B3'),borderColor:pts.map(col),borderWidth:1.5,hoverBorderWidth:3}]},options:o,plugins:[lblPlugin]});}

    const keys=[...g.keys()].sort((a,b)=>a==='Antes de 2026'?-1:b==='Antes de 2026'?1:a.localeCompare(b));

    o.plugins.legend={display:true,position:'bottom',labels:{color:p.ink,usePointStyle:true,pointStyle:'rectRounded',font:{family:'Inter',size:12,weight:'600'}}};

      {label:'Ya vencido',data:keys.map(x=>g.get(x).v),backgroundColor:p.danger,borderRadius:8,borderSkipped:false,maxBarThickness:34},
      {label:'Por vencer',data:keys.map(x=>g.get(x).p),backgroundColor:stripe(p.accent,p.dark?'#173322':'#DCEFE3'),borderColor:p.accent,borderWidth:1.5,borderRadius:8,borderSkipped:false,maxBarThickness:34}]},options:o});}

function animateCounts(){
