  $('#footer').innerHTML=`Fuente: estados de cuenta por edades y hojas de recibos de Incomelec SAS e Incomelec Service Group SAS (Suplec), corte ${fDate(DATA.corte)} (${DATA.semana}). ${D.rows.length} documentos de ${D.all.clients.length} clientes y ${DATA.recibos.length} aplicaciones de recibos. Corte anterior de referencia: ${fDate(DATA.anterior.corte)}. Cifras ${state.ncModo==='fuente'?'tal como vienen en la fuente':'con notas crédito restando (ajuste activo)'}. Uso interno del Comité de Dirección.`;
  icons();drawCharts();applySel();animateCounts();bindView();
  if(firstR&&!reduced()) $$('[data-flip]').forEach(el=>{const f=firstR.get(el.dataset.flip);if(!f)return;const l=el.getBoundingClientRect();const dx=f.left-l.left,dy=f.top-l.top;if(dx||dy)el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'});});
  if(state.inspCur&&$('#insp').classList.contains('open')) refreshInsp();
}
function refreshInsp(){const c=state.inspCur;if(!c)return;let html='';
  if(c.type==='list'){return;} // las listas se congelan al abrirse
  if(c.type==='cliente')html=inspCliente(c.id);else if(c.type==='empresa')html=inspEmpresa(c.id);else if(c.type==='comercial')html=inspComercial(c.id);else if(c.type==='factura')html=inspFactura(+c.id);else if(c.type==='dia')html=inspDia(c.id);else if(c.type==='recaudo')html=inspRecaudo();else if(c.type==='otras')html=inspOtras();else if(c.type==='prevdocs')html=inspPrevDocs();
  if(html){$('#inspBody').innerHTML=html;icons();}}
function withVT(fn){if(document.startViewTransition&&!reduced())document.startViewTransition(fn);else fn();}
function goView(v){
  if(state.view===v){$('#view').focus();return;}
  state.view=v;if(!state.pinned)closeInsp();
  withVT(()=>{$('#view').innerHTML=`<div class="bento"><div class="sk c-8" style="height:300px"></div><div class="sk c-4" style="height:300px"></div></div>`;
    setTimeout(()=>{render({enter:true});window.scrollTo({top:0,behavior:'auto'});$('#view').focus({preventScroll:true});},reduced()?0:140);});
}
function setCtx(e){
  const prev=state.empresa;if(prev===e){closeMenus();return;}
  state.empresa=e;closeMenus();withVT(()=>render());
  toast(`Mostrando ${e==='all'?'consolidado':empShort(e)} · ${D.A.kpi.nCli} clientes`,'ok',()=>setCtx(prev));
}

/* ---------- TOAST ---------- */
function toast(msg,tone='ok',undo){
  const box=$('#toasts');while(box.children.length>=2)box.firstChild.remove();
  const t=document.createElement('div');t.className='toast';t.innerHTML=`<span class="td ${tone==='bad'?'bad':''}"></span><span>${esc(msg)}</span>${undo?'<button>Deshacer</button>':''}`;
  if(undo)t.querySelector('button').onclick=()=>{t.remove();undo();};
  box.appendChild(t);setTimeout(()=>t.remove(),3000);
}

/* =========================================================
   EVENTOS
   ========================================================= */
function bindView(){
  const bindNum=(id,key,label,unit)=>{const el=$('#'+id);if(!el)return;el.addEventListener('change',()=>{const old=state.metas[key];const v=Number(el.value);if(!(v>=0))return;state.metas[key]=v;savePrefs();render();
    toast(`Meta de ${label} en ${unit==='$'?fmt(v):v+unit}`,'ok',()=>{state.metas[key]=old;savePrefs();render();});});};
  bindNum('mMaxV','maxVencida','% vencida','%');bindNum('mMax90','max90','+90 días','%');bindNum('mAnt','antObj','antigüedad',' días');bindNum('mRec','recupMeta','recuperación','$');
  const thr=$('#thr');if(thr){thr.addEventListener('input',()=>{state.metas.umbralSaldo=+thr.value;$('#thrVal').textContent=fmt(+thr.value);$('#critWrap').innerHTML=critHtml();icons();applySel();});
    thr.addEventListener('change',()=>{savePrefs();toast(`${critList().length} clientes críticos con umbral de ${fmtC(+thr.value)}`);});}
  critHtml();
  const fc=$('#fCom');if(fc)fc.onchange=()=>{state.cli.comercial=fc.value;render({flip:true});toast(fc.value==='all'?'Todos los comerciales':`${filteredClients().length} clientes de ${titleCase(fc.value)}`);};
  const fy=$('#fCiu');if(fy)fy.onchange=()=>{state.cli.ciudad=fy.value;render({flip:true});toast(`${filteredClients().length} clientes en la vista`);};
  const fq=$('#fQ');if(fq)fq.oninput=()=>{state.cli.q=fq.value;const b=$('#cliBody');const l=filteredClients();b.innerHTML=state.cli.modo==='tabla'?clientTable(l):clientCards(l);icons();applySel();const n=$('#cliBody').previousElementSibling;if(n&&n.classList.contains('note'))n.textContent=`${l.length} de ${D.A.clients.length} clientes · ${fmt(l.reduce((s,c)=>s+c.val,0))}`;};
  const sw=$('#swNC');if(sw)sw.onclick=()=>{const old=state.ncModo;state.ncModo=old==='fuente'?'credito':'fuente';render();toast(state.ncModo==='credito'?'Notas crédito restando de la cartera':'Cifras como vienen en la fuente','ok',()=>{state.ncModo=old;render();});};
  // teclado en calendario
  const grid=$('.cal-grid');if(grid)grid.addEventListener('keydown',e=>{const days=$$('.cal-day:not(.empty)',grid);const i=days.indexOf(document.activeElement);if(i<0)return;
    const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];if(mv==null)return;e.preventDefault();const n=days[Math.min(Math.max(i+mv,0),days.length-1)];n&&n.focus();});
}
function closeMenus(){$('#ctxMenu').classList.remove('open');$('#ctxBtn').setAttribute('aria-expanded','false');$('#results').classList.remove('open');$('#q').setAttribute('aria-expanded','false');}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!e.target.closest('.ctx'))$('#ctxMenu').classList.remove('open');
  if(!e.target.closest('.search'))$('#results').classList.remove('open');
  if(!t||t.disabled)return;
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'view':goView(id);break;
    case 'list':openList(id);break;
    case 'sel-cliente':selectObj('cliente',id);break;
    case 'comercial':selectObj('comercial',id);break;
    case 'factura':selectObj('factura',id);break;
    case 'dia':selectObj('dia',id);break;
    case 'recaudo':selectObj('recaudo');break;
    case 'otras':selectObj('otras','x');break;
    case 'reclist':case 'list-rec':{const rs=recCtx();const pick=id==='all'?rs:id==='venc'?rs.filter(r=>['d1','d2','d3','d4'].includes(r.tramo)):rs.filter(r=>r.tramo===id);
      const t=id==='all'?'Todos los recibos de la semana':id==='venc'?'Cobros de cartera vencida':TR_REC.find(z=>z.k===id).l;
      state.lastFocus=document.activeElement;openInsp(inspHead('Recaudo',esc(t),`${pick.length} pago(s) · ${fmt(pick.reduce((s,r)=>s+r.valor,0))}`,null)+recTable(pick,true,true),true,{type:'recaudo',id:'x'});break;}
    case 'prevdocs':selectObj('prevdocs','x');break;
    case 'empresa':{if(t.classList.contains('ecard')){$$('.ecard').forEach(c=>c!==t&&c.classList.remove('flipped'));t.classList.add('flipped');}selectObj('empresa',id);break;}
    case 'set-ctx':setCtx(id);break;
    case 'cli-estado':state.cli.estado=id;render({flip:true});toast(`${filteredClients().length} clientes ${id==='all'?'en total':'en estado '+id}`);break;
    case 'cli-modo':state.cli.modo=id;render();break;
    case 'sort':{const s=state.sort;if(s.col===id)s.dir=s.dir==='asc'?'desc':'asc';else{s.col=id;s.dir=['cli','emp','comPrincipal','ciu','estado'].includes(id)?'asc':'desc';}
      const b=$('#cliBody');b.innerHTML=clientTable(filteredClients());icons();applySel();const th=$(`#cliBody th button[data-id="${id}"]`);th&&th.focus();break;}
    case 'com-sort':state.sortCom=id;render({flip:true});break;
    case 'com-clientes':state.cli={...state.cli,comercial:id,estado:'all',ciudad:'all',q:''};goView('clientes');setTimeout(()=>toast(`Clientes de ${titleCase(id)}`),200);break;
    case 'cal':{if(id==='corte'){const [y,m]=ymd(DATA.corte);state.cal=[y,m];}else if(id==='hoy'){const [y,m]=ymd(todayISO());state.cal=[y,m];}else{let [y,m]=state.cal;m+=+id;if(m<0){m=11;y--;}if(m>11){m=0;y++;}state.cal=[y,m];}
      render();break;}
  }
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t.matches('[data-act]:not(button):not(input):not(select)')){e.preventDefault();t.click();}
  if(e.key==='Escape'){if($('#results').classList.contains('open')||$('#ctxMenu').classList.contains('open')){closeMenus();return;}closeInsp();}
  if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(t.tagName)){e.preventDefault();$('#q').focus();}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus();}
  if(t.tagName==='TR'&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const n=e.key==='ArrowDown'?t.nextElementSibling:t.previousElementSibling;n&&n.focus();}
  if(t.classList&&t.classList.contains('ecard')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const cs=$$('.ecard');const i=cs.indexOf(t);const n=cs[i+(e.key==='ArrowRight'?1:-1)];n&&n.focus();}
});
$('#scrim').onclick=closeInsp;$('#inspClose').onclick=closeInsp;
$('#inspBack').onclick=()=>{const p=state.inspHist.pop();if(!p)return;if(p.type==='list')openInsp(inspList(p.id),false,p);else{state.inspCur=null;selectObj(p.type,p.id,false);}$('#inspBack').style.visibility=state.inspHist.length?'visible':'hidden';};
$('#inspPin').onclick=()=>{state.pinned=!state.pinned;$('#inspPin').setAttribute('aria-pressed',state.pinned);$('#scrim').classList.toggle('open',!state.pinned&&$('#insp').classList.contains('open'));toast(state.pinned?'Panel fijado: sigue abierto al navegar':'Panel desfijado');};
$('#inspWide').onclick=()=>{state.wide=!state.wide;$('#insp').classList.toggle('wide',state.wide);$('#inspWide').setAttribute('aria-pressed',state.wide);};
$('#btnAlerts').onclick=()=>{if(state.view!=='resumen'){goView('resumen');setTimeout(()=>{const a=$('#alertsCard');a&&a.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'center'});},260);}else{const a=$('#alertsCard');a&&a.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'center'});}};
$('#ctxBtn').onclick=()=>{const m=$('#ctxMenu');const o=!m.classList.contains('open');m.classList.toggle('open',o);$('#ctxBtn').setAttribute('aria-expanded',o);if(o){const b=$('#ctxMenu [aria-checked="true"]');b&&b.focus();}};
$('#ctxMenu').addEventListener('keydown',e=>{const bs=$$('#ctxMenu button');const i=bs.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();(bs[i+1]||bs[0]).focus();}if(e.key==='ArrowUp'){e.preventDefault();(bs[i-1]||bs[bs.length-1]).focus();}});
const mqDark=window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const t=state.theme==='system'?(mqDark.matches?'dark':'light'):state.theme;document.documentElement.dataset.theme=t;
  $$('[data-theme-set]').forEach(b=>b.setAttribute('aria-checked',b.dataset.themeSet===state.theme));}
$$('[data-theme-set]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.themeSet;applyTheme();savePrefs();render();toast(state.theme==='system'?'Tema del sistema':state.theme==='dark'?'Tema oscuro':'Tema claro');});
$('.theme-seg').addEventListener('keydown',e=>{const bs=$$('[data-theme-set]');const i=bs.indexOf(document.activeElement);if(i<0)return;const d={ArrowRight:1,ArrowLeft:-1}[e.key];if(!d)return;e.preventDefault();const n=bs[(i+d+bs.length)%bs.length];n.focus();n.click();});
mqDark.addEventListener('change',()=>{if(state.theme==='system'){applyTheme();render();}});
$('#swWeek').onclick=()=>{state.weekStart=state.weekStart==='lun'?'dom':'lun';$('#swWeek').setAttribute('aria-checked',state.weekStart==='lun');savePrefs();render();toast('La semana inicia el '+(state.weekStart==='lun'?'lunes':'domingo'));};

/* ---------- BUSCADOR GLOBAL ---------- */
let resIdx=-1;
function searchRun(){
  const q=$('#q').value.trim().toLowerCase();const box=$('#results');
  if(!q){box.classList.remove('open');$('#q').setAttribute('aria-expanded','false');return;}
  const cl=D.all.clients.filter(c=>c.cli.toLowerCase().includes(q)||(c.nit||'').toLowerCase().includes(q)).slice(0,8);
  const cm=D.all.coms.filter(c=>c.com.toLowerCase().includes(q)).slice(0,4);
  const fv=q.length>=3?D.rows.filter(r=>(r.num||'').toLowerCase().includes(q)).slice(0,6):[];
  const ci=D.all.ciudades.filter(c=>c.ciu.toLowerCase().includes(q)).slice(0,3);
  let h='';
  if(cl.length)h+=`<div class="rt">CLIENTES</div>`+cl.map(c=>`<button role="option" data-act="sel-cliente" data-id="${esc(c.key)}">${mono(c.cli,c.emp,28)}<span><b style="font-size:13px">${esc(titleCase(c.cli))}</b><br><small style="color:var(--muted)">${esc(c.nit||'Sin NIT')} · ${empShort(c.emp)}</small></span><span class="rs">${fmtC(c.val)}</span></button>`).join('');
  if(cm.length)h+=`<div class="rt">COMERCIALES</div>`+cm.map(c=>`<button role="option" data-act="comercial" data-id="${esc(c.com)}"><i data-lucide="user-round"></i>${esc(titleCase(c.com))}<span class="rs">${fmtC(c.val)}</span></button>`).join('');
  if(ci.length)h+=`<div class="rt">CIUDADES</div>`+ci.map(c=>`<button role="option" data-act="list" data-id="${regList('Ciudad: '+c.ciu,c.nCli+' cliente(s)',c.rows)}"><i data-lucide="map-pin"></i>${esc(c.ciu)}<span class="rs">${fmtC(c.val)}</span></button>`).join('');
  if(fv.length)h+=`<div class="rt">DOCUMENTOS</div>`+fv.map(r=>`<button role="option" data-act="factura" data-id="${r.id}"><i data-lucide="file-text"></i>${esc(r.n)} · ${esc(titleCase(r.cli))}<span class="rs">${fmtC(r.val)}</span></button>`).join('');
  box.innerHTML=h||`<div class="empty" style="padding:16px">Sin resultados para "${esc(q)}"</div>`;
  box.classList.add('open');$('#q').setAttribute('aria-expanded','true');resIdx=-1;icons();
}
$('#q').addEventListener('input',searchRun);
$('#q').addEventListener('keydown',e=>{const bs=$$('#results button');if(!bs.length)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();resIdx=(resIdx+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.setAttribute('aria-selected',i===resIdx));bs[resIdx].scrollIntoView({block:'nearest'});}
  if(e.key==='Enter'){e.preventDefault();(bs[resIdx]||bs[0]).click();$('#results').classList.remove('open');}});
$('#results').addEventListener('click',()=>{setTimeout(()=>{$('#results').classList.remove('open');},0);});

/* ---------- BANDA FIJA ---------- */
function setHdrH(){const h=$('.hdr');if(!h)return;const fixed=getComputedStyle(h).position==='sticky';document.documentElement.style.setProperty('--hdr-h',fixed?h.offsetHeight+'px':'0px');}
let _cmp=false;window.addEventListener('scroll',()=>{const y=window.scrollY;const c=_cmp?y>8:y>160;if(c!==_cmp){_cmp=c;document.body.classList.toggle('compact',c);setTimeout(setHdrH,260);}},{passive:true});
if(window.ResizeObserver)new ResizeObserver(setHdrH).observe(document.querySelector('.hdr'));
/* ---------- ARRANQUE ---------- */
applyTheme();$('#swWeek').setAttribute('aria-checked',state.weekStart==='lun');
$('#view').innerHTML=`<div class="kpis">${'<div class="sk" style="height:150px"></div>'.repeat(5)}</div>`;
setTimeout(()=>render({enter:true}),reduced()?0:160);
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{placeNavInd();setHdrH();},150);});
</script>
