.tab-ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;background:var(--tx);transition:transform .35s var(--ease),width .35s var(--ease)}
.ctx{position:relative}
.ctx-btn{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border-radius:999px;min-height:36px;text-align:left}
.ctx-btn:hover{background:var(--sub)}
.mono{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;background:var(--acc-l);color:var(--acc-d);flex-shrink:0}
:root[data-theme="dark"] .mono{color:var(--acc)}
.ctx-btn b{font-size:13px;display:block;line-height:1.15}
.ctx-btn small{font-size:11px;color:var(--tx3);display:block}
.pop{position:absolute;top:calc(100% + 8px);left:0;max-height:min(70vh,520px);overflow:auto;background:var(--card);border-radius:18px;box-shadow:var(--sh-h);padding:8px;min-width:280px;z-index:40;display:none}
.pop.on{display:block;animation:pop .2s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:12px;text-align:left}
.opt:hover,.opt:focus-visible{background:var(--sub)}
.opt[aria-selected="true"]{background:var(--acc-l)}
.opt b{font-size:13px;display:block}.opt small{font-size:11.5px;color:var(--tx3)}
.hpill.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:15px;padding:6px 0}
.hpill.search input::placeholder{color:var(--tx3)}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--tx3)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);border-radius:18px;box-shadow:var(--sh-h);padding:8px;z-index:40;display:none;max-height:380px;overflow:auto}
.sres.on{display:block}
.sres .opt small{display:block}
.pop h6,.sres h6{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);padding:6px 8px 2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--sub)}

/* HEAD */
.vhead{display:flex;align-items:flex-end;justify-content:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.vhead h1{font-size:40px;font-weight:600;letter-spacing:-.025em;line-height:1.05}
.vhead p{color:var(--tx2);margin-top:6px;font-size:14.5px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:10px 18px;font-weight:600;font-size:13px;min-height:40px;transition:transform .2s var(--ease),background .2s}
.btn.pri{background:var(--tx);color:var(--card)}
.btn.pri:hover{transform:translateY(-1px)}
.btn.acc{background:var(--acc);color:#fff}
:root[data-theme="dark"] .btn.acc{color:#0E0F10}
.btn.sec{background:var(--sub);color:var(--tx)}
.btn.sec:hover{background:var(--line)}
.btn.sm{padding:6px 12px;min-height:32px;font-size:12px}

/* GRID / CARDS */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--sh);padding:24px;position:relative;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.card.hov:hover{transform:translateY(-3px);box-shadow:var(--sh-h)}
.enter{animation:enter .38s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.ch h3{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.3}
.ch .lbl{font-size:11.5px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.go{width:34px;height:34px;border-radius:50%;background:var(--sub);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,transform .2s var(--ease)}
.go:hover{background:var(--acc);color:#fff;transform:rotate(-8deg)}
.subc{background:var(--sub);border-radius:16px;padding:14px}

/* KPI */
.kpi{cursor:pointer;display:flex;flex-direction:column;gap:0;text-align:left;container-type:inline-size;min-height:0}
.kpi .kh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.kpi .k{font-size:14px;font-weight:650}
.kpi .ico{width:38px;height:38px;border-radius:12px;background:var(--sub);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi .ico svg.lucide{width:18px;height:18px}
.kpi .v{font-size:clamp(34px,17cqi,60px);font-weight:750;letter-spacing:-.03em;line-height:1}
.kpi .v small{font-size:.42em;font-weight:600;letter-spacing:0;color:var(--tx3);margin-left:4px}
.kpi .s{font-size:clamp(12.5px,4.6cqi,14px);color:var(--tx2);margin-top:8px}
.kpi .kf{margin-top:auto;padding-top:16px}
.kpi .kf .bar{height:10px}
.kf-row{display:flex;justify-content:space-between;font-size:12px;color:var(--tx3);margin-top:7px;gap:8px}
.kf-row b{color:var(--tx);font-weight:650}
.wspark{display:flex;align-items:flex-end;gap:6px;height:38px}
.wspark span{flex:1;border-radius:6px 6px 3px 3px;background:var(--acc-l);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.wspark span i{display:block;background:var(--acc);border-radius:inherit}
.kpi.hero{background:linear-gradient(135deg,#0E7A40 0%,#0A5A30 100%);color:#fff;overflow:hidden;isolation:isolate}
.kpi.hero::before{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgb(255 255 255 / .16),rgb(255 255 255 / 0) 70%);z-index:-1}
.kpi.hero .ico{background:rgb(255 255 255 / .16)}
.kpi.hero .s,.kpi.hero .kf-row{color:rgb(255 255 255 / .88)}
.kpi.hero .kf-row b{color:#fff}
.kpi.hero .bar{background:rgb(255 255 255 / .2)}
.kpi.hero .bar .c{background:#fff}
.kpi.hero .v small{color:rgb(255 255 255 / .8)}
:root[data-theme="dark"] .kpi.hero{background:linear-gradient(135deg,#0B6435 0%,#083F23 100%)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:650;white-space:nowrap}
.pill svg.lucide{width:13px;height:13px}
.pill.ok{background:var(--acc-l);color:var(--acc-d)}
:root[data-theme="dark"] .pill.ok{color:var(--acc)}
.pill.bad{background:var(--bad-l);color:var(--bad)}
.pill.warn{background:var(--warn-l);color:var(--warn)}
.pill.neu{background:var(--sub);color:var(--tx2)}
.pill.on-hero{background:rgb(255 255 255 / .18);color:#fff}

/* STRIPES */
.striped{background:repeating-linear-gradient(45deg,var(--stripe-a) 0 4px,var(--stripe-b) 4px 8px)}

/* GAUGE */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.gauge-wrap svg{width:100%;max-width:300px;height:auto;overflow:visible}
.gauge-c{margin-top:-62px;text-align:center}
.gauge-c b{font-size:38px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1}
.gauge-c>span{font-size:12px;color:var(--tx3)}
.gchips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.gchip{border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.gchip b{font-size:clamp(18px,2vw,24px);font-weight:750;line-height:1.1}
.gchip span{font-size:11.5px;font-weight:600}
.gchip.ok{background:var(--acc-l);color:var(--acc-d)}
:root[data-theme="dark"] .gchip.ok{color:var(--acc)}
.gchip.warn{background:var(--warn-l);color:var(--warn)}
.gchip.bad{background:var(--bad-l);color:var(--bad)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin-top:14px;justify-content:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}

/* LINE CHART */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--tx);color:var(--card);border-radius:12px;padding:8px 11px;font-size:12px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tip b{font-size:12.5px}

/* WEEK COLUMNS */
.cols{display:flex;align-items:flex-end;justify-content:space-around;gap:10px;height:200px;padding-top:30px}
.col{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;height:100%;justify-content:flex-end;position:relative}
.col-bar{width:min(46px,100%);border-radius:999px;overflow:hidden;display:flex;flex-direction:column;background:var(--sub);transition:height .5s var(--ease),transform .2s var(--ease)}
.col-bar .p{flex:0 0 auto}
.col-bar .c{background:var(--acc);flex:1 1 auto}
.col:hover .col-bar,.col:focus-visible .col-bar,.col.is-sel .col-bar{transform:scaleX(1.08)}
.col .tag{position:absolute;top:-4px;font-size:11.5px;font-weight:700;background:var(--tx);color:var(--card);padding:3px 8px;border-radius:999px;opacity:0;transform:translateY(4px);transition:.2s var(--ease);white-space:nowrap}
.col:hover .tag,.col:focus-visible .tag,.col.is-sel .tag{opacity:1;transform:none}
.col small{font-size:11.5px;color:var(--tx2);font-weight:600;text-align:center;line-height:1.2}
.col small span{display:block;font-weight:400;color:var(--tx3);font-size:11px}

/* ROWS */
.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;width:100%;text-align:left;transition:background .2s}
.row:hover,.row.is-sel{background:var(--sub)}
.row .meta{flex:1;min-width:0}
.row .meta b{font-size:13px;display:block}
.row .meta small{font-size:12px;color:var(--tx3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--tx3)}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .04)}
.av svg{width:100%;height:100%;display:block}
.bar{height:8px;border-radius:999px;background:var(--sub);overflow:hidden;display:flex}
.bar .c{background:var(--acc);border-radius:999px}
.bar .p{border-radius:0 999px 999px 0}
.frac{font-size:12px;font-weight:650;min-width:44px;text-align:right}

/* ALERTS */
.alert-hero{background:var(--bad-l);border-radius:18px;padding:16px;margin-bottom:10px;display:block;width:100%;text-align:left;transition:transform .2s var(--ease)}
.alert-hero:hover{transform:translateY(-2px)}
.alert-hero .big{font-size:28px;font-weight:700;color:var(--bad);line-height:1}
.alert-hero p{font-size:13px;margin-top:6px}
.alert-hero small{color:var(--tx2);font-size:12px}

/* INSIGHTS */
.ins{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;text-align:left;width:100%;transition:background .2s}
.ins:hover{background:var(--sub)}
.ins .n{width:28px;height:28px;border-radius:9px;background:var(--acc-l);color:var(--acc-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
:root[data-theme="dark"] .ins .n{color:var(--acc)}
.ins p{font-size:13.5px;line-height:1.4}
.ins small{display:block;font-size:11.5px;color:var(--tx3);margin-top:3px}

/* PEOPLE */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;background:var(--card);box-shadow:var(--sh);min-height:34px;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--tx);color:var(--card)}
.chip .cnt{font-size:11px;opacity:.75}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.pcard{display:flex;flex-direction:column;gap:14px;cursor:pointer}
.pcard.is-sel{box-shadow:0 0 0 2px var(--acc),var(--sh-h)}
.pcard .top-row{display:flex;gap:12px;align-items:center}
.pcard .av{width:48px;height:48px;font-size:15px}
.pcard h4{font-size:16px;font-weight:650}
.pcard .rol{font-size:12px;color:var(--tx3)}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pm .subc b{font-size:22px;font-weight:700;display:block;line-height:1.1}
.pm .subc span{font-size:11.5px;color:var(--tx3)}
.pact{display:flex;gap:8px;flex-wrap:wrap}

/* MATRIX */
.mx-wrap{overflow-x:auto;margin:0 -6px;padding:0 6px 4px}
.mx{border-collapse:separate;border-spacing:4px;width:100%;min-width:760px}
.mx th{font-size:11px;font-weight:600;color:var(--tx3);text-align:center;padding:2px;line-height:1.2}
.mx th.wk{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx2);border-bottom:2px solid var(--line);padding-bottom:4px}
.mx td.nm{text-align:left;white-space:nowrap;padding-right:6px}
.mx td.nm .row{padding:4px 6px}
.mx td.nm .av{width:28px;height:28px;font-size:10.5px}
.cell{width:100%;min-width:26px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease),box-shadow .15s}
.cell svg.lucide{width:15px;height:15px}
.cell:hover,.cell:focus-visible{transform:scale(1.1)}
.cell.ok{background:var(--acc);color:#fff}
:root[data-theme="dark"] .cell.ok{color:#0E0F10}
.cell.pe{color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.cell.pe{background:repeating-linear-gradient(45deg,var(--bad-l) 0 4px,transparent 4px 8px)}
.cell.no{background:var(--sub);color:var(--tx3);cursor:help}
.cell.dim{opacity:.22}
.cell.is-sel{box-shadow:0 0 0 2.5px var(--tx)}
.mx tr.is-sel td.nm .row{background:var(--sub)}

/* THEMES */
.thgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(var(--rows),auto);grid-auto-flow:column;gap:2px 24px}
.hbar{display:grid;grid-template-columns:170px 1fr 70px;align-items:center;gap:12px;width:100%;padding:6px 8px;border-radius:12px;text-align:left}
.hbar:hover,.hbar:focus-visible{background:var(--sub)}
.hbar .t{font-size:13px;font-weight:550}
.hbar .track{height:14px;border-radius:999px;background:var(--sub);display:flex;overflow:hidden}
.hbar:hover .track{background:var(--card)}
.hbar .track .c{background:var(--acc);border-radius:999px 0 0 999px}
.hbar .track .c:last-child{border-radius:999px}
.hbar .v{font-size:12.5px;font-weight:650;text-align:right}

/* TABLE */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.field{display:flex;align-items:center;gap:8px;background:var(--sub);border-radius:999px;padding:4px 14px;min-height:38px}
.field input,.field select{border:0;background:transparent;outline:none;font-size:13px;min-width:0}
.field select{cursor:pointer;padding:4px 0}
.field select option{background:var(--card);color:var(--tx)}
.tbl-wrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{text-align:left;font-size:11.5px;font-weight:650;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt th button{display:inline-flex;align-items:center;gap:4px;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;min-height:24px}
.dt th button svg.lucide{width:13px;height:13px}
.dt td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.dt tbody tr{cursor:pointer;transition:background .15s}
.dt tbody tr:hover{background:var(--sub)}
.dt tbody tr.is-sel{background:var(--acc-l)}
.dt .id{font-weight:700;white-space:nowrap}
.dt .id small{display:block;font-weight:400;color:var(--tx3);font-size:11.5px}
.dt .act{min-width:240px;max-width:380px}
.dt .ent{color:var(--tx2);min-width:180px;max-width:260px}
.who{display:flex;align-items:center;gap:8px;white-space:nowrap}
.who .av{width:26px;height:26px;font-size:10px}
.ep{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sub);color:var(--tx2);margin:1px 3px 1px 0;white-space:nowrap}
.tcount{font-size:12.5px;color:var(--tx2);margin-left:auto}
.empty{text-align:center;color:var(--tx3);padding:28px;font-size:13px}
details.dq summary{cursor:pointer;font-weight:650;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px;min-height:28px}
details.dq summary::-webkit-details-marker{display:none}
details.dq ul{margin:12px 0 0 0;padding-left:20px;font-size:13px;color:var(--tx2);display:grid;gap:6px}

/* INSPECTOR */
.insp-bg{position:fixed;inset:0;background:rgb(10 10 12 / .28);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);z-index:60}
.insp-bg.on{opacity:1;pointer-events:auto}
.insp{position:fixed;top:12px;right:12px;bottom:12px;width:min(560px,calc(100vw - 24px));background:var(--card);border-radius:26px;box-shadow:0 24px 60px rgb(0 0 0 / .22);z-index:61;transform:translateX(calc(100% + 24px));transition:transform .38s var(--ease);display:flex;flex-direction:column;overflow:hidden}
.insp.on{transform:none}
.insp-h{padding:22px 24px 14px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.insp-h .ty{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3)}
.insp-h h2{font-size:20px;font-weight:650;letter-spacing:-.015em;line-height:1.25;margin-top:4px}
.insp-h p{font-size:13px;color:var(--tx2);margin-top:4px}
.insp-b{padding:18px 24px 28px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.mk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mk .subc b{font-size:20px;font-weight:700;display:block}
.mk .subc span{font-size:11.5px;color:var(--tx3)}
dl.kv{display:grid;grid-template-columns:130px 1fr;gap:10px 14px;font-size:13.5px}
dl.kv dt{font-size:11.5px;font-weight:650;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.note{font-size:12.5px;color:var(--tx2);background:var(--warn-l);border-radius:12px;padding:10px 12px;display:flex;gap:8px}
.note svg.lucide{color:var(--warn);margin-top:1px}
.insp .dt td{padding:10px 8px}

/* TOAST */
.toasts{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:#111214;color:#F3F3F4;border-radius:999px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:0 12px 30px rgb(0 0 0 / .25);animation:pop .25s var(--ease)}
.toast .dot{background:oklch(0.72 0.14 150)}
.toast button{color:oklch(0.80 0.12 150);font-weight:700;padding:4px 8px;border-radius:999px}
.toast button:hover{background:rgb(255 255 255 / .1)}

.foot{text-align:center;font-size:12px;color:var(--tx3);margin-top:28px}
.local{font-size:11px;font-weight:650;color:var(--warn);background:var(--warn-l);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}

::view-transition-old(root),::view-transition-new(root){animation-duration:.25s}

/* RESPONSIVE */
@media (max-width:1180px){ .subnav-r{width:100%;justify-content:flex-start} .caption{flex-basis:100%} }
@media (max-width:900px){
  .hdr{flex-wrap:wrap;padding:20px 28px 20px 24px;gap:18px;min-height:0}
  .hdr::before,.hdr::after{border-radius:22px;clip-path:polygon(0 0,calc(100% - 40px) 0,100% 40px,100% 100%,0 100%)}
  .hdr-tools{flex:1 1 100%}
  .hpill.search{flex:1 1 auto;height:54px}
  .seg{height:54px;padding:5px}.seg button{width:44px;height:44px}
  .hdr-logo-in{height:56px;padding:0 24px}.hdr-logo-in svg{height:27px}
}
@media (max-width:620px){
  .hdr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"logo seg" "search search";padding:18px 34px 16px 18px;gap:16px}
  .hdr::before,.hdr::after{clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%)}
  .caption{font-size:11.5px;letter-spacing:.06em}

function countUp(root){
  root.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,dec=+el.dataset.dec,suf=el.dataset.suf||'';

function insights(list){
  const out=[],s=stats(list),M=DATA.meta.metaCumplimiento;
  if(!s.t)return out;
  const diff=s.r-M;
  out.push({txt:`El cumplimiento del mes es ${nf(s.r,1)}% (${s.c} de ${s.t}), ${diff>=0?nf(diff,1)+' pp por encima':nf(-diff,1)+' pp por debajo'} de la meta del ${M}%.`,
    src:`Columna «Estado» · ${rango()} · Confianza alta (dato directo)`,act:()=>openSet('Todas las tareas del mes',list)});
  const ws=WEEKS_M().map(w=>({w,l:list.filter(t=>t.semana===w.n)})).filter(x=>x.l.length).map(x=>({...x,s:stats(x.l)}));
  const worst=[...ws].sort((a,b)=>a.s.r-b.s.r)[0];
  if(worst&&worst.s.p){
    const okW=ws.filter(x=>x.s.p===0).map(x=>'S'+x.w.n);
    out.push({txt:`El hueco está en la semana ${worst.w.n} (${fDs(worst.w.a)}–${fDs(worst.w.b)}): ${worst.s.c} de ${worst.s.t} cerradas.${okW.length?` ${okW.join(', ')} cerraron al 100%.`:''}`,
      src:`Columnas «Fecha» y «Estado» · Confianza alta`,act:()=>openSet(`Semana ${worst.w.n} · ${fDs(worst.w.a)}–${fDs(worst.w.b)}`,worst.l)});
  }
  const ov=list.filter(vencida).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(ov.length){const o=ov[0];
    out.push({txt:`La pendiente más antigua es de ${o.resp} (${fDs(o.fecha)}): «${o.act}». Lleva ${diasV(o)} días sin cerrarse.`,
      src:`Fila ${o.fila} del Excel · Confianza alta`,act:()=>openTask(o.i)});
  }
  const pp=PEOPLE.map(p=>({p,s:stats(list.filter(t=>t.resp===p))})).filter(x=>x.s.t);
  if(pp.length>1){
    const lo=[...pp].sort((a,b)=>a.s.r-b.s.r||b.s.p-a.s.p)[0], hi=[...pp].sort((a,b)=>b.s.r-a.s.r)[0];
    const tops=pp.filter(x=>x.s.r===hi.s.r).map(x=>x.p);
    if(lo.s.r<hi.s.r) out.push({txt:`${tops.join(' y ')} ${tops.length>1?'lideran':'lidera'} con ${nf(hi.s.r,1)}%; ${lo.p} tiene el menor cumplimiento (${nf(lo.s.r,1)}%, ${lo.s.p} pendiente${lo.s.p!==1?'s':''}).`,
      src:`Columnas «Responsable» y «Estado» · Confianza alta`,act:()=>openPerson(lo.p)});
  }
  const th=THEMES.map(t=>({t,l:list.filter(x=>x.temas.includes(t.k))})).sort((a,b)=>b.l.length-a.l.length)[0];
  if(th&&th.l.length) out.push({txt:`«${th.t.l}» es la labor más repetida: aparece en ${th.l.length} de ${s.t} tareas (${nf(pct(th.l.length,s.t),0)}%).`,
    src:`Columna «Actividades», clasificada por palabras clave · Confianza media`,act:()=>openSet(th.t.l,th.l)});
  return out.slice(0,5);
}
function lineChart(list){
  const W=Math.round(Math.min(640,Math.max(340,(($('#view').clientWidth||700)-48)*(innerWidth>1180?0.66:1)))),H=Math.round(W*0.36)+20,pl=34,pr=14,pt=14,pb=28;
  const pts=FECHAS_M().map(f=>{const up=list.filter(t=>t.fecha<=f);return{f,p:up.length,c:up.filter(done).length,day:list.filter(t=>t.fecha===f)}});
  const max=Math.max(1,...pts.map(p=>p.p));
  const x=i=>pl+i*(W-pl-pr)/Math.max(1,pts.length-1), y=v=>pt+(1-v/max)*(H-pt-pb);
  const lp=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.p).toFixed(1)}`).join('');
  const lc=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.c).toFixed(1)}`).join('');
  const area=lc+`L${x(pts.length-1)},${y(0)}L${x(0)},${y(0)}Z`;
  const ticks=[0,Math.round(max/2),max];
  let g=ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-dasharray="${v?'2 4':''}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" style="fill:var(--tx3)">${v}</text>`).join('');
  pts.forEach((p,i)=>{ if(i%3===0||i===pts.length-1) g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" style="fill:var(--tx3)">${d0(p.f).getDate()}</text>`; });
  const last=pts[pts.length-1];
  const lab=`<text x="${x(pts.length-1)-4}" y="${y(last.p)-8}" text-anchor="end" font-size="11.5" font-weight="600" style="fill:var(--tx2)">Programadas ${last.p}</text>
    <text x="${x(pts.length-1)-4}" y="${y(last.c)+30}" text-anchor="end" font-size="11.5" font-weight="700" style="fill:var(--acc)">Completadas ${last.c}</text>`;
  const hits=pts.map((p,i)=>`<rect class="hit" data-i="${i}" x="${x(i)-(W-pl-pr)/(pts.length-1)/2}" y="${pt}" width="${(W-pl-pr)/(pts.length-1)}" height="${H-pt-pb}" fill="transparent" style="cursor:pointer"/>`).join('');
  const firstGap=pts.findIndex(p=>p.p>p.c);
  const title= last.p===last.c ? 'Todo lo programado en el mes quedó cerrado'
    : firstGap>0 ? `Al día hasta el ${fDs(pts[firstGap-1].f)}; el mes cierra con ${last.p-last.c} abierta${last.p-last.c!==1?'s':''}`
    : `El mes cierra con ${last.p-last.c} tareas abiertas`;
  const table=`<table class="sr"><caption>Avance acumulado por día</caption><tr><th>Día</th><th>Programadas</th><th>Completadas</th></tr>${pts.map(p=>`<tr><td>${fDs(p.f)}</td><td>${p.p}</td><td>${p.c}</td></tr>`).join('')}</table>`;
  return {title,pts,html:`<div class="chart" id="lc"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}. Programadas acumuladas ${last.p}, completadas ${last.c}.">
    ${g}<path d="${area}" fill="url(#areaG)"/><path d="${lp}" fill="none" style="stroke:var(--tx3)" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="${lc}" fill="none" style="stroke:var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line id="guide" y1="${pt}" y2="${H-pb}" style="stroke:var(--tx);opacity:0" stroke-width="1"/>
    <circle id="gp" r="5" style="fill:var(--card);stroke:var(--acc);opacity:0" stroke-width="3"/>
    ${lab}${hits}</svg><div class="tip" id="tip"></div>${table}</div>`,x,y,W};
}
function renderResumen(v){
  const L=scope(),s=stats(L),M=DATA.meta.metaCumplimiento;
  const lc=lineChart(L);

function renderEquipo(v){
  const L=scope();
  const ps=PEOPLE.map(p=>({p,l:L.filter(t=>t.resp===p)})).map(x=>({...x,s:stats(x.l)})).filter(x=>x.s.t);
  const F={todas:()=>true,pend:x=>x.s.p>0,ok:x=>x.s.p===0};

  const vis=ps.filter(F[state.equipoFiltro]);
  const th=THEMES.map(t=>({t,l:L.filter(x=>x.temas.includes(t.k))})).filter(x=>x.l.length).sort((a,b)=>b.l.length-a.l.length);
  const thMax=Math.max(1,...th.map(x=>x.l.length));
  const sinTema=L.filter(t=>!t.temas.length);

  v.innerHTML=`
  <div class="vhead"><h1 class="sr">Equipo</h1>
    <div class="chips" role="group" aria-label="Filtrar personas">
      ${[['todas','Todas'],['pend','Con pendientes'],['ok','Al 100%']].map(([k,l])=>`<button class="chip" aria-pressed="${state.equipoFiltro===k}" data-f="${k}">${l}<span class="cnt">${cF[k]}</span></button>`).join('')}

  <div class="people" id="people" aria-live="polite">

      <div class="top-row">${av(x.p)}<div style="flex:1;min-width:0"><h4>${x.p}</h4><div class="rol">${esc(P.rol)}</div></div>${x.s.p?`<span class="pill bad">${ic('circle-alert')}${x.s.p} pend.</span>`:`<span class="pill ok">${ic('circle-check')}Al día</span>`}</div>
      <div class="pm"><div class="subc"><b class="num">${x.s.t}</b><span>tareas en el mes</span></div><div class="subc"><b class="num">${nf(x.s.r,1)}%</b><span>cumplimiento</span></div></div>
      <div><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-bottom:6px"><span>${x.s.c} completada${x.s.c!==1?'s':''}</span><span>${x.s.p} pendiente${x.s.p!==1?'s':''}</span></div>${progBar(x.s.c,x.s.t)}</div>
      <div style="font-size:12px;color:var(--tx3)">Foco diario: ${esc(P.foco)}</div>
      <div class="pact"><button class="btn sec sm" data-open="${x.p}">${ic('panel-right-open')}Ver perfil</button><button class="btn sec sm" data-items="${x.p}">${ic('list')}Sus tareas</button></div>
    </article>`}).join('')||'<p class="empty">Nadie coincide con este filtro.</p>'}
  </div>

  <div class="bento" style="margin-top:18px">
    <section class="card c12 enter" style="--i:4" aria-labelledby="h-mx">
      <div class="ch"><div><div class="lbl">${ic('calendar-check')}Calendario de cumplimiento</div><h3 id="h-mx">Cada casilla es una tarea del cronograma: los pendientes se agrupan al cierre del mes</h3></div></div>
      <div class="mx-wrap">${matrix(L)}</div>
      <div class="legend" style="justify-content:flex-start"><span><i style="background:var(--acc)"></i>✓ Completada</span><span><i style="background:repeating-linear-gradient(45deg,var(--bad-l) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 2px var(--bad)"></i>! Pendiente</span><span><i style="background:var(--sub)"></i>— Sin tarea en el Excel</span><span style="color:var(--tx3)">Flechas para moverse · Enter para abrir</span></div>
    </section>
    <section class="card c12 enter" style="--i:5" aria-labelledby="h-th">
      <div class="ch"><div><div class="lbl">${ic('layers')}En qué se va el trabajo</div><h3 id="h-th">${th[0]?`«${th[0].t.l}» y «${th[1]?.t.l||''}» son las labores más frecuentes del mes`:'Sin datos'}</h3></div></div>

  wireMatrix(v,L);
}
function matrix(L){
  const ids=new Set(L.map(t=>t.i));
  let h='<table class="mx" role="grid" aria-label="Calendario de cumplimiento por persona y día"><thead><tr><th></th>';
  WEEKS_M().forEach(w=>{const n=FECHAS_M().filter(f=>f>=w.a&&f<=w.b).length;h+=`<th class="wk" colspan="${n}">Semana ${w.n}</th>`});
  h+='</tr><tr><th><span class="sr">Persona</span></th>'+FECHAS_M().map(f=>{const t=T.find(x=>x.fecha===f);return `<th scope="col"><abbr title="${t.dia} ${fD(f)}" style="text-decoration:none">${t.dia.slice(0,2)}<br>${d0(f).getDate()}</abbr></th>`}).join('')+'</tr></thead><tbody>';
  (state.persona?[state.persona]:PEOPLE).forEach((p,r)=>{
    h+=`<tr data-row="${p}" class="${state.sel?.type==='person'&&state.sel.id===p?'is-sel':''}"><td class="nm"><button class="row" data-p="${p}" aria-label="Ver perfil de ${p}">${av(p)}<b style="font-size:13px">${p}</b></button></td>`;
    FECHAS_M().forEach((f,c)=>{
      const t=T.find(x=>x.fecha===f&&x.resp===p);
      if(!t){h+=`<td><span class="cell no" data-r="${r}" data-c="${c}" tabindex="-1" role="gridcell" aria-label="${p}, ${fD(f)}: sin tarea registrada en el Excel" title="Sin tarea registrada">—</span></td>`;return}
      const ok=done(t),sel=state.sel?.type==='task'&&state.sel.id===t.i;
      h+=`<td><span class="cell ${ok?'ok':'pe'} ${ids.has(t.i)?'':'dim'} ${sel?'is-sel':''}" data-t="${t.i}" data-r="${r}" data-c="${c}" tabindex="-1" role="gridcell" aria-label="${p}, ${t.dia} ${fD(f)}: ${esc(t.act)}. ${ok?'Completada':'Pendiente'}">${ic(ok?'check':'circle-alert')}</span></td>`;
    });
    h+='</tr>';
  });
  return h+'</tbody></table>';
}
function wireMatrix(v,L){
  const cells=[...v.querySelectorAll('.mx .cell')];
  if(!cells.length)return;
  const first=v.querySelector('.mx .cell.is-sel')||v.querySelector('.mx .cell.pe:not(.dim)')||cells[0];first.tabIndex=0;
  v.querySelectorAll('.mx [data-p]').forEach(b=>b.onclick=()=>openPerson(b.dataset.p));
  cells.forEach(c=>{
    if(c.dataset.t)c.onclick=()=>openTask(+c.dataset.t);
    c.onkeydown=e=>{
      let r=+c.dataset.r,k=+c.dataset.c;
      if(e.key==='ArrowRight')k++;else if(e.key==='ArrowLeft')k--;else if(e.key==='ArrowDown')r++;else if(e.key==='ArrowUp')r--;
      else if((e.key==='Enter'||e.key===' ')&&c.dataset.t){e.preventDefault();openTask(+c.dataset.t);return}else return;
      e.preventDefault();const n=v.querySelector(`.mx .cell[data-r="${r}"][data-c="${k}"]`);
      if(n){c.tabIndex=-1;n.tabIndex=0;n.focus()}
    };
  });
}
/* FLIP */
function flipFirst(c){const m=new Map();c.querySelectorAll('[data-key]').forEach(e=>m.set(e.dataset.key,e.getBoundingClientRect()));return m}
function flipPlay(c,before){
  if(RM)return;
  c.querySelectorAll('[data-key]').forEach(e=>{
    e.classList.remove('enter');
    const a=before.get(e.dataset.key),b=e.getBoundingClientRect();
    if(a){const dx=a.left-b.left,dy=a.top-b.top;if(dx||dy)e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'})}
    else e.animate([{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'none'}],{duration:300,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}

/* ═══════════════ VISTA: TAREAS (detalle) ═══════════════ */
function tablaFiltrada(){
  const f=state.tabla,q=f.q.trim().toLowerCase();
  let l=scope().filter(t=>(!f.estado||est(t)===f.estado)&&(!f.persona||t.resp===f.persona)&&(!f.semana||t.semana===+f.semana)&&(!f.tema||t.temas.includes(f.tema))
    &&(!q||[t.act,t.ent,t.resp,t.empresa,t.dia,fD(t.fecha),t.id,t.inicio,t.cierre].join(' ').toLowerCase().includes(q)));
  const k=f.sort,dir=f.dir;
  const key={fecha:t=>t.fecha+t.resp,resp:t=>t.resp+t.fecha,empresa:t=>t.empresa,act:t=>t.act.toLowerCase(),ent:t=>t.ent.toLowerCase(),estado:t=>(done(t)?'1':'0')+t.fecha,id:t=>String(t.fila).padStart(4,'0')}[k];
  return l.sort((a,b)=>key(a)<key(b)?-dir:key(a)>key(b)?dir:0);
}
function renderTareas(v){
  const base=scope(),f=state.tabla,s=stats(base);
  const pc={'':s.t,Completada:s.c,Pendiente:s.p};
  const dq=[];
  const TT=TM();
  const norm=TT.filter(t=>t.estado!==t.estadoFuente);
  if(norm.length)dq.push(`${norm.length} fila con estado escrito distinto («${norm.map(t=>t.estado).join('», «')}», fila ${norm.map(t=>t.fila).join(', ')}): se cuenta como «Completada».`);
  const miss=[];FECHAS_M().forEach(fe=>PEOPLE.forEach(p=>{if(!TT.some(t=>t.fecha===fe&&t.resp===p))miss.push(`${p} el ${fDs(fe)}`)}));
  if(miss.length)dq.push(`Sin tarea registrada: ${miss.join(', ')}. Por eso el mes suma ${TT.length} y no ${FECHAS_M().length*PEOPLE.length} tareas.`);
  const noEnt=TT.filter(t=>!t.ent);if(noEnt.length)dq.push(`${noEnt.length} tarea sin entregable (fila ${noEnt.map(t=>t.fila).join(', ')}): se muestra «Sin dato».`);
  const c01=TT.filter(t=>/^01:00/.test(t.cierre));if(c01.length)dq.push(`Los viernes (${c01.length} filas) la rutina de cierre dice «01:00»; parece 1:00 p. m. Se deja como está en el Excel.`);
  const sp=TT.filter(t=>/-\S/.test(t.empresa)&&!/ - /.test(t.empresa));if(sp.length)dq.push(`La columna «Empresa» mezcla «Incomelec - Suplec» e «Incomelec -Suplec» (${sp.length} filas); se tratan como la misma combinación.`);
  dq.push('Encabezado «Incio» en el Excel (se lee como «Inicio»). Hay errores menores de digitación en «Actividades» que se conservan tal cual.');
  {const pv=TT.filter(vencida).length;if(pv)dq.push(`${pv} pendiente${pv!==1?'s':''} con fecha ya pasada: el estado puede estar desactualizado en el Excel. Si se cerraron, márcalas desde su detalle (ajuste local) y actualiza el archivo.`);}

  v.innerHTML=`
  <div class="vhead"><h1 class="sr">Tareas</h1>
    <button class="btn sec" id="btnCsv">${ic('download')}Descargar CSV</button></div>
  <section class="card enter" aria-labelledby="h-tb">
    <h2 id="h-tb" class="sr">Detalle de tareas</h2>
    <div class="tools">
      <div class="chips" role="group" aria-label="Estado">${[['','Todas'],['Completada','Completadas'],['Pendiente','Pendientes']].map(([k,l])=>`<button class="chip" aria-pressed="${f.estado===k}" data-e="${k}">${l}<span class="cnt">${pc[k]}</span></button>`).join('')}</div>
      <label class="field">${ic('user')}<span class="sr">Responsable</span><select id="fp"><option value="">Todo el equipo</option>${PEOPLE.map(p=>`<option ${f.persona===p?'selected':''}>${p}</option>`).join('')}</select></label>
      <label class="field">${ic('calendar')}<span class="sr">Semana</span><select id="fw"><option value="">Todo el mes</option>${WEEKS_M().map(w=>`<option value="${w.n}" ${+f.semana===w.n?'selected':''}>Semana ${w.n} · ${fDs(w.a)}–${fDs(w.b)}</option>`).join('')}</select></label>
      <label class="field">${ic('layers')}<span class="sr">Labor</span><select id="ft"><option value="">Todas las labores</option>${THEMES.map(t=>`<option value="${t.k}" ${f.tema===t.k?'selected':''}>${t.l}</option>`).join('')}</select></label>
      <label class="field" style="flex:1;min-width:200px">${ic('search')}<span class="sr">Buscar en la tabla</span><input id="fq" type="search" placeholder="Buscar en actividades, entregables…" value="${esc(f.q)}"></label>
      <button class="btn sec sm" id="fclr">${ic('rotate-ccw')}Limpiar</button>
    </div>
    <div style="display:flex;align-items:center;margin-bottom:6px"><span class="tcount" id="tcount" aria-live="polite"></span></div>
    <div class="tbl-wrap"><table class="dt"><thead><tr>
      ${[['id','Fila'],['fecha','Fecha'],['resp','Responsable'],['empresa','Empresa'],['act','Actividades'],['ent','Entregable'],['estado','Estado']].map(([k,l])=>`<th aria-sort="${f.sort===k?(f.dir>0?'ascending':'descending'):'none'}"><button data-sort="${k}">${l}${ic(f.sort===k?(f.dir>0?'arrow-up':'arrow-down'):'arrow-up-down')}</button></th>`).join('')}
    </tr></thead><tbody id="tb"></tbody></table></div>
  </section>
  <section class="card enter" style="--i:1;margin-top:18px">
    <details class="dq"><summary>${ic('triangle-alert')}Calidad del dato · ${dq.length} observaciones${ic('chevron-down')}</summary><ul>${dq.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>
  </section>`;
  fillTable(v);
  v.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{state.tabla.estado=b.dataset.e;v.querySelectorAll('[data-e]').forEach(x=>x.setAttribute('aria-pressed',x===b));fillTable(v)});
  v.querySelector('#fp').onchange=e=>{state.tabla.persona=e.target.value;fillTable(v)};
  v.querySelector('#fw').onchange=e=>{state.tabla.semana=e.target.value;fillTable(v)};
  v.querySelector('#ft').onchange=e=>{state.tabla.tema=e.target.value;fillTable(v)};
  v.querySelector('#fq').oninput=e=>{state.tabla.q=e.target.value;fillTable(v)};
  v.querySelector('#fclr').onclick=()=>{state.tabla={...state.tabla,estado:'',persona:'',semana:'',tema:'',q:''};renderTareas(v);icons()};
  v.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{const k=b.dataset.sort;state.tabla.dir=state.tabla.sort===k?-state.tabla.dir:1;state.tabla.sort=k;renderTareas(v);icons();v.querySelector(`[data-sort="${k}"]`).focus()});
  v.querySelector('#btnCsv').onclick=()=>{
    const rows=[['Fila','Fecha','Día','Responsable','Empresa','Inicio','Actividades','Entregable','Rutina de cierre','Estado (Excel)','Estado (dashboard)']].concat(tablaFiltrada().map(t=>[t.fila,t.fecha,t.dia,t.resp,t.empresa,t.inicio,t.act,t.ent,t.cierre,t.estado,est(t)]));
    const csv='﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`tareas-contabilidad-${state.mes}.csv`;a.click();
    toast(`CSV descargado · ${rows.length-1} filas`);
  };
}
function fillTable(v){
  const l=tablaFiltrada();
  v.querySelector('#tcount').textContent=`Mostrando ${l.length} de ${scope().length} tareas`;
  v.querySelector('#tb').innerHTML=l.length?l.map(t=>`<tr tabindex="0" data-t="${t.i}" class="${state.sel?.type==='task'&&state.sel.id===t.i?'is-sel':''}" aria-label="Fila ${t.fila}: ${esc(t.act)}, ${t.resp}, ${fD(t.fecha)}, ${est(t)}">
    <td class="id num">${t.fila}<small>Excel</small></td>
    <td style="white-space:nowrap"><b>${fDs(t.fecha)}</b><br><span style="color:var(--tx3);font-size:12px">${cap(t.dia)} · S${t.semana}</span></td>
    <td><span class="who">${av(t.resp)}${t.resp}</span></td>
    <td>${emPills(t)}</td>
    <td class="act">${esc(t.act)}</td>
    <td class="ent">${t.ent?esc(t.ent):'<span class="pill neu">Sin dato</span>'}</td>
    <td>${pillEst(t)}${state.overrides[t.id]?'<span class="local">Ajuste local</span>':''}</td></tr>`).join('')
    :`<tr><td colspan="7" class="empty">Ninguna tarea coincide con estos filtros.</td></tr>`;
  v.querySelectorAll('#tb tr[data-t]').forEach(r=>{r.onclick=()=>openTask(+r.dataset.t);r.onkeydown=e=>{
    if(e.key==='Enter'){openTask(+r.dataset.t)}
    if(e.key==='ArrowDown'){r.nextElementSibling?.focus();e.preventDefault()}
    if(e.key==='ArrowUp'){r.previousElementSibling?.focus();e.preventDefault()}
  }});
  icons();
}

/* ═══════════════ INSPECTOR ═══════════════ */
let lastFocus=null;
function openInsp(type,title,sub,body){
  if(!$('#insp').classList.contains('on'))lastFocus=document.activeElement;
  $('#inspType').textContent=type;$('#inspTitle').textContent=title;$('#inspSub').innerHTML=sub;
  $('#inspBody').innerHTML=body;$('#inspBody').scrollTop=0;
  $('#insp').classList.add('on');$('#insp').setAttribute('aria-hidden','false');$('#inspBg').classList.add('on');
  icons();countUp($('#inspBody'));
  setTimeout(()=>$('#inspClose').focus(),RM?0:60);
}
function closeInsp(){
  $('#insp').classList.remove('on');$('#insp').setAttribute('aria-hidden','true');$('#inspBg').classList.remove('on');
  if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus();
}
$('#inspClose').onclick=closeInsp;$('#inspBg').onclick=closeInsp;
$('#insp').addEventListener('keydown',e=>{ // trampa de foco
  if(e.key!=='Tab')return;const f=[...$('#insp').querySelectorAll('button,[tabindex="0"],a,input,select')].filter(x=>x.offsetParent);
  if(!f.length)return;const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){z.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===z){a.focus();e.preventDefault()}
});
function miniTable(list,showResp=true){
  return `<div class="tbl-wrap"><table class="dt"><thead><tr><th>Fecha</th>${showResp?'<th>Responsable</th>':''}<th>Actividad · entregable</th><th>Estado</th></tr></thead><tbody>
  ${[...list].sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.resp.localeCompare(b.resp)).map(t=>`<tr tabindex="0" data-it="${t.i}"><td style="white-space:nowrap"><b>${fDs(t.fecha)}</b><br><span style="font-size:11.5px;color:var(--tx3)">Fila ${t.fila}</span></td>${showResp?`<td><span class="who">${av(t.resp)}${t.resp}</span></td>`:''}<td>${esc(t.act)}<br><span style="font-size:12px;color:var(--tx3)">${t.ent?esc(t.ent):'Sin dato'}</span></td><td>${pillEst(t)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function wireMini(){ $('#inspBody').querySelectorAll('[data-it]').forEach(r=>{r.onclick=()=>openTask(+r.dataset.it);r.onkeydown=e=>{if(e.key==='Enter')openTask(+r.dataset.it)}}) }
function setSel(sel){ state.sel=sel; syncSel(); }
function syncSel(){
  document.querySelectorAll('.is-sel').forEach(e=>e.classList.remove('is-sel'));
  const s=state.sel;if(!s)return;
  if(s.type==='task'){
    document.querySelectorAll(`#tb tr[data-t="${s.id}"], .mx .cell[data-t="${s.id}"]`).forEach(e=>{e.classList.add('is-sel');e.scrollIntoView({block:'nearest',inline:'nearest',behavior:RM?'auto':'smooth'})});
  } else if(s.type==='person'){
    document.querySelectorAll(`.pcard[data-key="${s.id}"], #view .row[data-p="${s.id}"]`).forEach(e=>e.classList.add('is-sel'));
    document.querySelectorAll(`.mx tbody tr[data-row="${s.id}"]`).forEach(tr=>tr.classList.add('is-sel'));
  }
}
function openSet(title,list,kind='Conjunto'){
  const s=stats(list);setSel(null);
  openInsp(kind.toUpperCase()+' · '+s.t+' TAREAS',title,`${s.c} completadas · ${s.p} pendientes${state.empresa?` · ${state.empresa}`:''}`,
    `<div class="mk"><div class="subc"><b>${cnt(s.t)}</b><span>Tareas</span></div><div class="subc"><b>${cnt(s.c)}</b><span>Completadas</span></div><div class="subc"><b style="color:${s.p?'var(--bad)':'inherit'}">${cnt(s.p)}</b><span>Pendientes</span></div></div>
     <div><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-bottom:6px"><span>Cumplimiento</span><b class="num">${nf(s.r,1)}%</b></div>${progBar(s.c,s.t)}</div>
     ${list.length?miniTable(list):'<p class="empty">Sin tareas.</p>'}`);
  wireMini();
}
function openPerson(p){
  const P=DATA.personas[p],l=scopeBase().filter(t=>t.resp===p),s=stats(l);
  setSel({type:'person',id:p});
  const th=THEMES.map(t=>({t,n:l.filter(x=>x.temas.includes(t.k)).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,4);
  openInsp('PERSONA · '+P.ini,p,`${esc(P.rol)} · ${[...new Set(l.flatMap(t=>t.emps))].join(', ')}`,
    `<div>${s.p?`<span class="pill bad">${ic('circle-alert')}${s.p} pendiente${s.p!==1?'s':''} — ${s.v} vencida${s.v!==1?'s':''}</span>`:`<span class="pill ok">${ic('circle-check')}Al día: todas sus tareas del mes están cerradas</span>`}</div>
     <div class="mk"><div class="subc"><b>${cnt(s.t)}</b><span>Tareas</span></div><div class="subc"><b>${cnt(s.c)}</b><span>Completadas</span></div><div class="subc"><b>${cnt(s.r,1,'%')}</b><span>Cumplimiento</span></div></div>
     ${progBar(s.c,s.t)}
     <dl class="kv"><dt>Foco diario</dt><dd>${esc(P.foco)}</dd><dt>Labores más frecuentes</dt><dd>${th.map(x=>`<span class="ep">${x.t.l} · ${x.n}</span>`).join('')||'—'}</dd></dl>
     <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec sm" id="toTable">${ic('table')}Abrir en la tabla</button></div>
     ${miniTable(l,false)}`);
  wireMini();
  $('#toTable').onclick=()=>{closeInsp();state.tabla={...state.tabla,persona:p,estado:'',semana:'',tema:'',q:''};if(state.view==='tareas'){renderView()}else go('tareas')};
}
function openTask(i){
  const t=T[i],P=DATA.personas[t.resp];setSel({type:'task',id:i});
  const ok=done(t),ov=state.overrides[t.id];
  const desc=ok?(ov?'Marcada como completada en este navegador (en el Excel sigue pendiente).':'Registrada como completada en el Excel.')
    :vencida(t)?`Programada para el ${fD(t.fecha)}; lleva ${diasV(t)} días sin cerrarse.`:'Aún dentro de su fecha.';
  openInsp(`TAREA · FILA ${t.fila} DEL EXCEL`,t.act,`${cap(t.dia)} ${fD(t.fecha)} · Semana ${t.semana} · ${t.resp}`,
    `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${pillEst(t)}${ov?'<span class="local">Ajuste local</span>':''}<span style="font-size:13px;color:var(--tx2)">${desc}</span></div>
     <dl class="kv">
       <dt>Responsable</dt><dd><span class="who">${av(t.resp)}<span><b>${t.resp}</b><br><span style="font-size:12px;color:var(--tx3)">${esc(P.rol)}</span></span></span></dd>
       <dt>Empresa</dt><dd>${emPills(t)}</dd>
       <dt>Actividades</dt><dd>${esc(t.act)}</dd>
       <dt>Entregable</dt><dd>${t.ent?esc(t.ent):'<span class="pill neu">Sin dato</span>'}</dd>
       <dt>Inicio</dt><dd>${esc(t.inicio)}</dd>
       <dt>Rutina de cierre</dt><dd>${esc(t.cierre)}</dd>
       <dt>Estado en Excel</dt><dd>${esc(t.estado)}</dd>
       <dt>Labores</dt><dd>${t.temas.map(k=>`<span class="ep">${THEMES.find(x=>x.k===k).l}</span>`).join('')||'Sin clasificar'}</dd>
     </dl>
     ${t.flags.map(f=>`<div class="note">${ic('triangle-alert')}<span>${esc(f)}</span></div>`).join('')}
     <div style="display:flex;gap:8px;flex-wrap:wrap">
       ${!ok?`<button class="btn acc" id="mark">${ic('check')}Marcar como completada</button>`:''}
       ${ov?`<button class="btn sec" id="revert">${ic('rotate-ccw')}Volver al dato del Excel</button>`:''}
       <button class="btn sec" id="seePerson">${ic('user')}Ver a ${t.resp}</button>
     </div>
     ${!ok||ov?'<p style="font-size:12px;color:var(--tx3)">Los ajustes se guardan solo en este navegador y no modifican el Excel.</p>':''}
     <div><div class="lbl" style="font-size:11.5px;font-weight:650;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Mismo día, todo el equipo</div>${miniTable(T.filter(x=>x.fecha===t.fecha))}</div>`);
  wireMini();
  const m=$('#mark');if(m)m.onclick=()=>setOverride(t,'Completada');
  const r=$('#revert');if(r)r.onclick=()=>setOverride(t,null);
  $('#seePerson').onclick=()=>openPerson(t.resp);
}
function setOverride(t,val){
  const prev=state.overrides[t.id]||null;
  const apply=v=>{ if(v)state.overrides[t.id]=v;else delete state.overrides[t.id]; store.set('ov',state.overrides); renderAll(true); if($('#insp').classList.contains('on')&&state.sel?.type==='task'&&state.sel.id===t.i)openTask(t.i); };
  apply(val);
  toast(val?`Tarea del ${fDs(t.fecha)} marcada como completada`:`Tarea del ${fDs(t.fecha)} vuelve a su estado del Excel`,()=>apply(prev));
}

/* ═══════════════ TOAST ═══════════════ */
function toast(msg,undo){
  const box=$('#toasts');while(box.children.length>=2)box.firstElementChild.remove();
  const el=document.createElement('div');el.className='toast';
  el.innerHTML=`<span class="dot"></span><span>${esc(msg)}</span>${undo?'<button>Deshacer</button>':''}`;
  if(undo)el.querySelector('button').onclick=()=>{undo();el.remove()};
  box.appendChild(el);setTimeout(()=>el.remove(),undo?4500:2800);
}

/* ═══════════════ RENDER ═══════════════ */
let prevCounts={};
function renderView(keepCounts){
  const v=$('#view');
  ({resumen:renderResumen,equipo:renderEquipo,tareas:renderTareas})[state.view](v);
  v.setAttribute('aria-labelledby','tab-'+state.view);
  if(keepCounts) v.querySelectorAll('.enter').forEach(e=>e.classList.remove('enter'));
  // contadores: desde el valor anterior si cambió el estado
  v.querySelectorAll('[data-count]').forEach((el,i)=>{const k=state.view+i;if(keepCounts&&prevCounts[k]!=null)el.dataset.from=prevCounts[k];prevCounts[k]=+el.dataset.count});
  icons();countUp(v);syncSel();
}
function renderAll(keep){ renderTabs();renderCtx();renderView(keep); }

/* ═══════════════ INICIO ═══════════════ */
applyTheme();icons();renderAll();
let rT;addEventListener('resize',()=>{moveInd();clearTimeout(rT);rT=setTimeout(()=>{if(state.view==='resumen')renderView(true)},200)});
document.fonts&&document.fonts.ready.then(moveInd);
</script>
